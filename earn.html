<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Santoryu — Earn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Rajdhani:wght@500;600;700&family=Teko:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#E8B44A; --gold-hi:#FFE08A; --gold-deep:#A9781F;
    --blue:#4DA6FF; --blue-hi:#9BD4FF; --blue-deep:#1E63B0; --cyan:#5FE6FF;
    --emerald:#2DD4A7;
    --bg:#07090C; --surf:#11151B; --surf2:#161B22; --line:#222a34;
    --txt:#EDF1F5; --txt2:#8A95A3; --danger:#FF5E6C; --amber:#F5B445; --green:#34D399;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;}
  html,body{background:var(--bg);}
  body{font-family:'Inter',sans-serif; color:var(--txt); padding:14px 14px 34px; max-width:440px; margin:0 auto;
    background:radial-gradient(120% 36% at 50% -4%, rgba(77,166,255,.06), transparent 60%), var(--bg);}
  .hide{display:none !important;}

  /* diamonds = REAL provided asset (diamond.webp). BLUE = MLBB (withdraw), GOLD = points (tinted) */
  .dia{display:inline-block; vertical-align:middle; background-position:center; background-repeat:no-repeat; background-size:contain;}
  .dia.blue{background-image:url('gem-blue.png');}
  .dia.gold{background-image:url('gem-gold.png');}

  /* header (now in HTML) */
  .head{display:flex; align-items:center; justify-content:space-between; padding:4px 2px 0; margin-bottom:15px;}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .logo{width:34px;height:34px;border-radius:10px; display:flex;align-items:center;justify-content:center;
    background:linear-gradient(150deg,#1c2128,#0c0f14); border:1px solid rgba(232,180,74,.4); box-shadow:0 4px 14px -4px rgba(232,180,74,.4);}
  .brand h1{font-family:'Chakra Petch'; font-weight:700; font-size:21px; letter-spacing:.5px; line-height:1;}
  .brand small{display:block; font-family:'Rajdhani'; font-weight:600; font-size:10px; letter-spacing:3px; color:var(--txt2); margin-top:2px;}
  .balpill{display:flex; align-items:center; gap:8px; background:linear-gradient(180deg,rgba(232,180,74,.14),rgba(232,180,74,.05));
    border:1px solid rgba(232,180,74,.45); padding:9px 15px; border-radius:30px; box-shadow:0 4px 14px -6px rgba(232,180,74,.5); transition:transform .2s;}
  .balpill.bump{animation:bump .5s ease;}
  @keyframes bump{0%,100%{transform:scale(1);}35%{transform:scale(1.16);}}
  .balpill .v{font-family:'Rajdhani'; font-weight:700; font-size:18px; color:var(--gold-hi);}
  /* header check-in icon (opens daily dialog) */
  .hright{display:flex; align-items:center; gap:9px;}
  .ckbtn{position:relative; width:42px; height:42px; flex:0 0 auto; display:flex; align-items:center; justify-content:center; border-radius:12px; cursor:pointer;
    background:var(--surf2); border:1px solid var(--line); color:var(--txt2); transition:transform .15s,border-color .2s,color .2s;}
  .ckbtn svg{width:22px; height:22px;}
  .ckbtn:active{transform:scale(.92);}

  /* dashboard tab bar (Home / Clipping / Invite / Tasks) */
  .tabbar{position:sticky; top:0; z-index:30; display:flex; gap:2px; margin:0 -14px 16px; padding:0 10px;
    background:linear-gradient(180deg,var(--bg),rgba(7,9,12,.86)); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);}
  .tab{flex:1; text-align:center; padding:13px 4px 11px; font-family:'Rajdhani'; font-weight:700; font-size:14px;
    letter-spacing:.06em; color:var(--txt2); border-bottom:2px solid transparent; cursor:pointer; transition:color .18s,border-color .18s;}
  .tab.active{color:var(--txt); border-bottom-color:var(--gold);}
  .tab:active{transform:translateY(1px);}
  .tab .cdot{display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--gold); margin-left:6px; vertical-align:middle;}
  #tabbody{min-height:62vh;}
  /* Home quick-stats strip */
  .qstats{display:flex; gap:2px; padding:14px 6px; margin-bottom:15px;}
  .qstat{flex:1; text-align:center; position:relative;}
  .qstat+.qstat::before{content:''; position:absolute; left:0; top:20%; height:60%; width:1px; background:var(--line);}
  .qstat .qv{font-family:'Rajdhani'; font-weight:700; font-size:19px; color:var(--txt); font-variant-numeric:tabular-nums;}
  .qstat:first-child .qv{color:var(--gold-hi);}
  .qstat .ql{font-size:9.5px; font-weight:700; letter-spacing:.08em; color:var(--txt2); margin-top:2px;}
  /* Clipping teaser */
  .cliphero{position:relative; overflow:hidden; border-radius:18px; padding:22px 20px;
    background:radial-gradient(120% 150% at 100% -20%, rgba(77,166,255,.16), transparent 55%), linear-gradient(150deg,#12202e,#0c1016 82%);
    border:1px solid rgba(77,166,255,.28); box-shadow:0 16px 40px -24px rgba(77,166,255,.5);}
  .ch-eyebrow{display:inline-flex; align-items:center; gap:7px; font-family:'Rajdhani'; font-weight:700; font-size:11px; letter-spacing:.14em; color:var(--blue-hi);}
  .ch-eyebrow span{width:7px; height:7px; border-radius:50%; background:var(--cyan); box-shadow:0 0 8px var(--cyan);}
  .ch-title{font-family:'Chakra Petch'; font-weight:700; font-size:22px; line-height:1.12; margin:10px 0 8px;}
  .ch-sub{font-size:13px; color:var(--txt2); line-height:1.5;}
  .ch-steps{display:flex; gap:8px; margin:16px 0 18px; flex-wrap:wrap;}
  .ch-step{display:inline-flex; align-items:center; gap:7px; font-size:12px; font-weight:600; color:var(--txt); background:rgba(255,255,255,.04); border:1px solid var(--line); border-radius:20px; padding:6px 11px;}
  .ch-step b{display:inline-flex; align-items:center; justify-content:center; width:17px; height:17px; border-radius:50%; background:var(--blue); color:#04121f; font-size:11px;}
  .ch-cta{width:100%; padding:13px; border:none; border-radius:12px; font-family:'Rajdhani'; font-weight:700; font-size:15px; letter-spacing:.04em; color:var(--txt2); background:var(--surf2); border:1px solid var(--line); cursor:not-allowed;}
  .ckbtn.ready{color:var(--gold-hi); border-color:rgba(232,180,74,.5); background:linear-gradient(180deg,rgba(232,180,74,.16),rgba(232,180,74,.04)); box-shadow:0 4px 14px -6px rgba(232,180,74,.5);}
  .ckdot{position:absolute; top:-3px; right:-3px; width:11px; height:11px; border-radius:50%; background:var(--emerald); border:2px solid var(--bg); box-shadow:0 0 8px rgba(45,212,167,.8); animation:gmblink 1.5s ease-in-out infinite;}
  /* daily check-in dialog */
  .ckmask{position:fixed; inset:0; z-index:60; background:rgba(4,6,9,.72); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; padding:26px; animation:fadein .2s ease;}
  .ckcard{position:relative; width:100%; max-width:340px; border-radius:22px; padding:26px 22px 22px; text-align:center; overflow:hidden;
    background:radial-gradient(120% 90% at 50% -10%, rgba(45,212,167,.16), transparent 55%), linear-gradient(170deg,#141a16,#0b0f14 78%); border:1px solid rgba(45,212,167,.3); box-shadow:0 30px 70px -30px rgba(0,0,0,.9);}
  .ckcard .ckx{position:absolute; top:12px; right:14px; width:30px; height:30px; border-radius:9px; background:rgba(255,255,255,.05); border:1px solid var(--line); color:var(--txt2); font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .ckcard .ckbig{width:74px; height:74px; margin:2px auto 0; border-radius:20px; display:grid; place-items:center;
    background:radial-gradient(120% 120% at 30% 0%, rgba(45,212,167,.28), rgba(232,180,74,.12)); border:1px solid rgba(45,212,167,.4);}
  .ckcard .ckbig svg{width:38px; height:38px;}
  .ckcard .cktitle{font-family:'Teko','Rajdhani',sans-serif; font-weight:700; font-size:30px; line-height:1; margin:14px 0 0; color:var(--txt);}
  .ckcard .cksub{font-size:13px; color:var(--txt2); line-height:1.5; margin:8px 0 0;}
  .ckcard .ckreward{display:inline-flex; align-items:center; gap:7px; margin:15px 0 4px; font-family:'Teko','Rajdhani',sans-serif; font-weight:700; font-size:36px; color:var(--gold-hi); text-shadow:0 2px 18px rgba(232,180,74,.4);}
  .ckcard .ckgo{width:100%; margin-top:16px; border:none; border-radius:14px; padding:15px; font-family:'Chakra Petch'; font-weight:700; font-size:14px; letter-spacing:.06em; cursor:pointer;
    background:linear-gradient(180deg,#5ff0c8,var(--emerald) 55%,#0f9d76); color:#04231b; box-shadow:0 12px 30px -10px rgba(45,212,167,.55);}
  .ckcard .ckgo.off{background:var(--surf2); color:var(--txt2); box-shadow:none; cursor:default;}
  .ckcard .ckgo:active{transform:translateY(1px);}
  .ckcard.ckwin{background:radial-gradient(120% 90% at 50% -10%, rgba(232,180,74,.22), transparent 55%), linear-gradient(170deg,#1a160c,#0b0f14 78%); border-color:rgba(232,180,74,.4);}
  .ckcard.ckwin .ckbig{background:radial-gradient(120% 120% at 30% 0%, rgba(232,180,74,.32), rgba(45,212,167,.12)); border-color:rgba(232,180,74,.5);}
  .ckcard .ckbig svg{color:var(--gold-hi);}
  .rdm-inwrap{margin:14px 0 2px;}
  .rdm-inwrap input{width:100%; background:#0b0f14; border:1px dashed rgba(232,180,74,.45); border-radius:12px; padding:14px 14px; color:var(--gold-hi); font-family:'Chakra Petch'; font-weight:700; letter-spacing:2px; text-transform:uppercase; font-size:16px; text-align:center;}
  .rdm-inwrap input:focus{outline:none; border-style:solid; border-color:var(--gold);}
  .rdm-inwrap input::placeholder{color:var(--txt2); letter-spacing:1.5px;}
  /* redeem entry card sa dashboard */
  .rdm{display:flex; align-items:center; gap:13px; margin:14px 0 4px; padding:14px 15px; border-radius:16px; cursor:pointer;
    background:linear-gradient(150deg,#17140b,#0d1117 66%); border:1px solid rgba(232,180,74,.24);}
  .rdm-ic{width:40px; height:40px; flex:0 0 auto; border-radius:12px; display:grid; place-items:center; color:var(--gold-hi); background:rgba(232,180,74,.12); border:1px solid rgba(232,180,74,.28);}
  .rdm-ic svg{width:22px; height:22px;}
  .rdm-mid{flex:1; min-width:0;}
  .rdm-t{font-family:'Rajdhani'; font-weight:700; font-size:15px; color:var(--txt);}
  .rdm-s{font-size:11.5px; color:var(--txt2); margin-top:1px;}
  .rdm-btn{flex:0 0 auto; background:rgba(232,180,74,.15); border:1px solid rgba(232,180,74,.4); color:var(--gold-hi); font-family:'Rajdhani'; font-weight:700; font-size:12.5px; letter-spacing:.05em; padding:9px 15px; border-radius:11px; cursor:pointer;}

  /* HERO (BLUE = MLBB diamonds) */
  .hero{position:relative; border-radius:22px; overflow:hidden; padding:19px;
    background:linear-gradient(100deg, rgba(8,11,16,.94) 26%, rgba(8,11,16,.55) 58%, rgba(8,11,16,.25) 100%), url('hero-with.jpg') center/cover #080b10;
    border:1px solid rgba(77,166,255,.5); box-shadow:0 18px 46px -18px rgba(77,166,255,.42), inset 0 1px 0 rgba(255,255,255,.09);}
  .eyebrow{font-family:'Chakra Petch'; font-weight:700; font-size:10.5px; letter-spacing:3px; color:var(--cyan); text-shadow:0 0 12px rgba(95,230,255,.5);}
  .reward{display:flex; align-items:center; gap:10px; margin-top:2px;}
  .num{font-family:'Teko'; font-weight:700; font-size:72px; line-height:.8; color:var(--blue-hi); text-shadow:0 2px 16px rgba(77,166,255,.45);}
  .rlabel{font-family:'Rajdhani'; line-height:1.05;}
  .rlabel .a{font-weight:700; font-size:23px; letter-spacing:1px; display:block;}
  .rlabel .b{font-weight:600; font-size:14px; letter-spacing:4.5px; color:var(--txt2); display:block; margin-top:1px;}
  .sub{font-size:11px; color:var(--txt2); margin-top:10px; font-weight:500; max-width:185px; line-height:1.4;}
  .emblem{display:none;}
  @keyframes floaty{0%,100%{transform:translateY(-44%);}50%{transform:translateY(-37%);}}
  .prog{margin-top:14px;}
  .prow{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:6px;}
  .prow .l{font-family:'Chakra Petch'; font-weight:600; font-size:9.5px; letter-spacing:3px; color:var(--txt2);}
  .prow .r{font-family:'Rajdhani'; font-weight:700; font-size:14px; color:var(--cyan);}
  .track{height:10px; border-radius:6px; background:rgba(255,255,255,.07); box-shadow:inset 0 1px 2px rgba(0,0,0,.5); overflow:hidden;}
  .fill{height:100%; border-radius:6px; background:linear-gradient(90deg,var(--emerald),var(--cyan)); box-shadow:0 0 10px rgba(95,230,255,.6); width:0; transition:width 1s cubic-bezier(.2,.8,.2,1);}
  .cta{position:relative; overflow:hidden; margin-top:15px; height:48px; border-radius:14px; border:1px solid rgba(155,212,255,.6); display:flex; align-items:center; justify-content:center; gap:9px; cursor:pointer;
    background:linear-gradient(180deg,var(--blue-hi),var(--blue) 45%,var(--blue-deep)); box-shadow:0 7px 18px -4px rgba(77,166,255,.5), inset 0 1px 0 rgba(255,255,255,.5);}
  .cta:not(.off)::after{content:''; position:absolute; top:0; bottom:0; left:-45%; width:32%; transform:skewX(-20deg); background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent); animation:tvsweep 3.8s ease-in-out infinite;}
  .cta:active{transform:scale(.98);}
  .cta.off{background:var(--surf2); border-color:var(--line); box-shadow:none; cursor:default;}
  .cta span{font-family:'Chakra Petch'; font-weight:700; font-size:14px; letter-spacing:3px; color:#04121f;}
  .cta.off span{color:var(--txt2); letter-spacing:1px;}

  .sh{display:flex; align-items:center; justify-content:space-between; margin:26px 2px 12px;}
  .sh .t{position:relative; font-family:'Chakra Petch'; font-weight:700; font-size:12px; letter-spacing:2.5px; color:var(--txt); padding-left:13px;}
  .sh .t::before{content:''; position:absolute; left:0; top:50%; transform:translateY(-50%); width:4px; height:14px; border-radius:2px; background:linear-gradient(180deg,#5ff0c8,var(--emerald)); box-shadow:0 0 9px rgba(45,212,167,.65);}
  .sh .x{font-size:11px; color:var(--gold); font-weight:600;}
  .sh .x.blue{color:var(--cyan);}

  .tiers{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
  .tier{position:relative; background:linear-gradient(165deg,#171f2a,#0c1116); border:1px solid rgba(255,255,255,.06); border-radius:14px; padding:12px 4px 10px; text-align:center; cursor:pointer; transition:transform .12s,border-color .2s; box-shadow:0 6px 18px -12px rgba(0,0,0,.7);}
  .tier:active{transform:scale(.95);}
  .tier.lock{border-color:rgba(77,166,255,.5); background:linear-gradient(180deg,rgba(77,166,255,.10),var(--surf));}
  .tier.used{opacity:.4; cursor:default;}
  .tier .tg{width:24px;height:24px;margin:0 auto 6px;}
  .tier .n{font-family:'Teko'; font-weight:600; font-size:23px; line-height:.8;}
  .tier .u{font-size:8px; letter-spacing:1px; color:var(--txt2); margin-top:2px;}
  .tier .c{margin-top:7px; font-family:'Rajdhani'; font-weight:700; font-size:12px; color:var(--gold); border-top:1px solid var(--line); padding-top:6px; display:flex; align-items:center; justify-content:center; gap:4px;}
  /* withdraw — Codashop-style selectable grid + single button */
  .wd{margin-bottom:4px;}
  .tiers.wsel{grid-template-columns:repeat(3,1fr);}
  .tier.sgrid{position:relative; cursor:pointer; padding:13px 4px 11px;}
  .tier.sgrid.sel{border-color:var(--cyan); background:linear-gradient(180deg,rgba(95,230,255,.18),#0b1015); box-shadow:0 0 0 1.5px rgba(95,230,255,.5), 0 8px 22px -8px rgba(95,230,255,.35);}
  .tier.sgrid.poor{opacity:.45;}
  .tier .selck{position:absolute; top:6px; right:7px; width:17px; height:17px; border-radius:50%; background:#4DA6FF; color:#06223f; font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center;}
  .wdbtn{position:relative; overflow:hidden; width:100%; margin-top:13px; border:none; border-radius:15px; padding:16px; font-family:'Chakra Petch'; font-weight:700; font-size:13.5px; letter-spacing:.8px; cursor:pointer;}
  .wdbtn.go{background:linear-gradient(180deg,#5ff0c8,var(--emerald) 55%,#0f9d76); color:#04231b; box-shadow:0 10px 26px -8px rgba(45,212,167,.5), inset 0 1px 0 rgba(255,255,255,.55);}
  .wdbtn.go::after{content:''; position:absolute; top:0; bottom:0; left:-45%; width:32%; transform:skewX(-20deg); background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent); animation:tvsweep 3.6s ease-in-out infinite;}
  .wdbtn.go:active{transform:translateY(1px);}
  .wdbtn.off{background:rgba(255,255,255,.05); color:var(--txt2); cursor:default;}

  .card{position:relative; background:linear-gradient(160deg,#18222e,#0d1218 82%); border:1px solid rgba(255,255,255,.07); border-radius:18px; padding:16px; box-shadow:0 12px 32px -18px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,255,255,.045);}
  .card::before{content:''; position:absolute; top:0; left:18px; right:18px; height:1.5px; border-radius:2px; background:linear-gradient(90deg,transparent,rgba(45,212,167,.45),transparent);}
  .rowflex{display:flex; align-items:center; gap:12px;}
  .di{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto; overflow:hidden;}
  .di svg{width:21px;height:21px;}
  .di img{width:100%;height:100%;object-fit:cover;}
  .icimg{width:28px;height:28px;object-fit:contain;display:block;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4));}
  .gleft{flex:1; min-width:0;}
  .gleft .n{font-family:'Rajdhani'; font-weight:700; font-size:16px; line-height:1.15;}
  .gleft .d{font-size:11px; color:var(--txt2); margin-top:1px;}
  .act{font-family:'Rajdhani'; font-weight:700; font-size:13px; letter-spacing:.5px; padding:10px 18px; border-radius:11px; cursor:pointer; white-space:nowrap; border:none; transition:transform .12s;}
  .act:active{transform:scale(.94);}
  .act.on{background:linear-gradient(90deg,var(--emerald),var(--gold)); color:#04140f; box-shadow:0 6px 16px -8px rgba(45,212,167,.5), inset 0 1px 0 rgba(255,255,255,.4);}
  .act.off{background:var(--surf2); color:var(--txt2); cursor:default;}

  /* invite: code + copy + share + share link + apply code */
  .inv .row1{display:flex; align-items:center; gap:8px;}
  .code{flex:1; font-family:'Chakra Petch'; font-weight:700; font-size:15px; letter-spacing:1px; color:var(--emerald); background:#0d1117; border:1px dashed rgba(45,212,167,.4); border-radius:9px; padding:10px 12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .icb{width:42px;height:42px;flex:0 0 auto;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;transition:transform .12s;}
  .icb:active{transform:scale(.9);}
  .icb svg{width:19px;height:19px;}
  .icb.copy{background:rgba(232,180,74,.14); border:1px solid rgba(232,180,74,.4);}
  .icb.copy svg{stroke:var(--gold);}
  .share2{display:flex; gap:8px; margin-top:9px;}
  .sbtn{flex:1; display:flex; align-items:center; justify-content:center; gap:7px; font-family:'Rajdhani'; font-weight:700; font-size:13px; letter-spacing:.5px; padding:12px; border-radius:12px; border:none; cursor:pointer; transition:transform .12s;}
  .sbtn:active{transform:scale(.96);}
  .sbtn.code{background:linear-gradient(180deg,var(--emerald),#1aa583); color:#04140f;}
  .sbtn.link{background:rgba(95,230,255,.12); border:1px solid rgba(95,230,255,.35); color:var(--cyan);}
  .sbtn svg{width:15px;height:15px;}
  .applywrap{margin-top:11px; padding-top:12px; border-top:1px solid var(--line);}
  .applylbl{font-size:11px; color:var(--txt2); margin-bottom:8px;}
  .applybox{display:flex; gap:8px;}
  .appliedbox{display:flex; align-items:center; gap:11px; margin-top:11px; padding-top:12px; border-top:1px solid var(--line);}
  .appliedbox .ckc{width:25px;height:25px;border-radius:50%;background:var(--emerald);color:#04140f;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:0 0 auto;}
  .appliedbox .apl{flex:1;min-width:0;}
  .appliedbox .apt{font-size:10px;letter-spacing:1.5px;color:var(--emerald);font-weight:700;font-family:'Chakra Petch';}
  .appliedbox .apc2{font-family:'Chakra Petch';font-weight:700;font-size:15px;letter-spacing:1px;color:var(--txt);margin-top:2px;}
  .appliedbox .lock{font-size:14px;opacity:.5;flex:0 0 auto;}
  .applybox input{flex:1; background:#0d1117; border:1px solid var(--line); border-radius:9px; padding:10px 12px; color:var(--txt); font-size:13px; font-family:'Chakra Petch'; letter-spacing:1px; text-transform:uppercase;}
  .applybox input:focus{outline:none; border-color:var(--emerald);}

  /* sub-page */

    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; animation:cgshine 2.6s linear infinite;}

  /* custom toast */

  .rpamt{font-family:'Teko';font-weight:700;font-size:50px;line-height:1;color:#FFE08A;text-shadow:0 0 20px rgba(232,180,74,.8);margin-top:2px;display:flex;align-items:center;gap:9px;animation:rpamt 1.6s ease both;}

  @keyframes rise{from{opacity:0;}to{opacity:1;}}

  .ivh-applybox button{background:rgba(45,212,167,.15); border:1px solid rgba(45,212,167,.4); color:var(--emerald); font-family:'Rajdhani'; font-weight:700; padding:0 16px; border-radius:10px; cursor:pointer; flex:0 0 auto;}

  /* ── Tongits Go campaign hero (gold premium, owner-scoped during testing) ── */

  .tgh-track{position:relative; z-index:1; display:flex; gap:5px; margin-top:14px;}

  .tgh-steplbl{position:relative; z-index:1; display:flex; justify-content:space-between; margin-top:8px;

  .tgh-steplbl b{color:var(--gold-hi);}

  /* Tongits Go detail page — 6-step ladder */
  .tgpage{padding:4px 2px 30px;}

  .tgp-step.locked .tgp-dot{background:rgba(255,255,255,.08); color:var(--txt2);}
  .tgp-txt{flex:1; min-width:0;}

  /* Required Usage-access gate — appears after Register is approved; unlocks the Day-play steps */
  .tgp-gate{display:flex; align-items:center; gap:12px; margin:0 0 10px; padding:14px; border-radius:14px;

  /* Detail-page hero — richer: title, steps badge, collected-diamonds bar, spade watermark */

  .tgp-top{display:flex; align-items:center; justify-content:space-between; gap:10px;}

  .tgp-title{font-family:'Teko'; font-weight:700; font-size:34px; line-height:.95; color:#fff; margin:9px 0 2px;}

  /* =======================================================================
     CLEAN REDESIGN LAYER (2026-08-24) — calm, trustworthy, less "gaming glow".
     Overrides the busier gradients/neon above for a professional wallet feel.
     ======================================================================= */
  :root{
    --bg:#0A0C10; --surf:#12151B; --surf2:#171B22; --surf3:#1E232C;
    --line:#242A33; --line2:#2E3641; --hair:rgba(255,255,255,.055);
    --txt:#F3F5F8; --txt2:#98A2B2; --txt3:#6B7482;
    --gold:#E8B44A; --gold-hi:#FFD98A; --blue:#4DA6FF; --blue-hi:#8FC6FF; --green:#34D399;
    --shadow:0 10px 30px -20px rgba(0,0,0,.7);
    --rad:16px; --rad-sm:12px;
  }
  body{background:var(--bg); padding:12px 14px 40px;}
  /* section headers — quiet, confident, no glow */
  .sh{margin:22px 2px 12px;}
  .sh .t{font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:11.5px; letter-spacing:2px; color:var(--txt2); padding-left:12px;}
  .sh .t::before{background:var(--gold); box-shadow:none; width:3px; height:13px; border-radius:2px;}
  .sh .x{color:var(--txt2); font-weight:600;}
  /* card — flat surface, hairline border, soft depth (no gradient top bar) */
  .card{background:var(--surf); border:1px solid var(--hair); border-radius:var(--rad);
    box-shadow:var(--shadow); padding:16px;}
  .card::before{display:none !important; content:none !important;}
  .fill{box-shadow:none !important;}
  .empty{color:var(--txt2);}

  /* HEADER — clean top bar */
  .head{padding:6px 2px 2px; margin-bottom:18px;}
  .brand h1{font-size:20px; letter-spacing:.4px;}
  .brand small{color:var(--txt3); letter-spacing:2.4px;}
  .brand .logo{background:var(--surf2); border:1px solid var(--line); box-shadow:none; border-radius:11px;}
  .balpill{background:var(--surf2); border:1px solid var(--line); box-shadow:none; padding:9px 15px;}
  .balpill .v{color:var(--gold-hi);}
  .ckbtn{background:var(--surf2); border:1px solid var(--line);}

  /* PROFILE — calm identity card, neutral hairline */
  .profile{background:var(--surf); border:1px solid var(--hair); box-shadow:var(--shadow);
    border-radius:var(--rad); padding:14px 16px; gap:14px;}
  .pf-av{border:2px solid rgba(232,180,74,.55); box-shadow:none; background:var(--surf3);}
  .pf-name{font-size:16px;}
  .pf-sub{color:var(--txt2);} .pf-sub b{color:var(--gold-hi);}
  .pf-stat{border-left:1px solid var(--line);}
  .pf-sv{color:var(--blue-hi);}
  .pf-sl{color:var(--txt3); letter-spacing:1.2px;}

  /* BALANCE (wallet hero) — the trust anchor. Calm blue, confident number, clean track */
  .wbanner{background:linear-gradient(160deg,#122232,#0E141C 70%); border:1px solid rgba(77,166,255,.22);
    box-shadow:var(--shadow); border-radius:var(--rad); padding:18px 18px 16px; margin:8px 0 6px;}
  .wbanner::before{display:none !important; content:none !important;}
  .wb-eyebrow{color:var(--blue-hi); letter-spacing:.16em; font-size:10px;}
  .wb-bal{font-size:44px; text-shadow:none; color:var(--txt); gap:10px;}
  .wb-glabel{color:var(--txt3);}
  .wb-gval{color:var(--blue-hi);}
  .wb-track{height:7px; background:rgba(255,255,255,.06); border:none; margin-top:15px;}
  .wb-track .fill{background:var(--blue); box-shadow:none !important;}
  .wb-prog{color:var(--txt2); font-weight:600;}
  .wb-cta{background:var(--blue); border:none; color:#052440; box-shadow:none; font-weight:700; padding:10px 18px; border-radius:11px;}
  .wb-cta.ready{background:var(--blue); box-shadow:none;}

  /* QUICK STATS — clean divided row */
  .qstats{background:var(--surf); border:1px solid var(--hair); box-shadow:var(--shadow); padding:15px 6px;}
  .qstat+.qstat::before{background:var(--line);}
  .qstat .qv{color:var(--txt);} .qstat:first-child .qv{color:var(--gold-hi);}
  .qstat .ql{color:var(--txt3);}

  /* TAB BAR — calm */
  .tabbar{background:var(--bg); border-bottom:1px solid var(--line); backdrop-filter:none;}
  .tab{color:var(--txt3);} .tab.active{color:var(--txt); border-bottom-color:var(--gold);}

  /* INVITE hero — calm gold, no foil bar */
  .ivhero{background:linear-gradient(160deg,#1B1810,#0E141C 66%); border:1px solid rgba(232,180,74,.2);
    box-shadow:var(--shadow); border-radius:var(--rad); padding:18px 16px 16px;}
  .ivhero::before{display:none !important; content:none !important;}
  .ivh-eyebrow{color:var(--gold);} .ivh-eyebrow i{box-shadow:none;}
  .ivh-title{font-size:18px;}
  .ivh-reward{color:var(--gold-hi); text-shadow:none;}
  .ivh-codebox{background:var(--surf3); border:1px solid var(--line); border-radius:var(--rad-sm);}
  .ivh-codeval{color:var(--gold-hi);}
  .ivh-copy{color:var(--txt2);}
  .ivh-share{background:var(--green); color:#052E22; box-shadow:none; border-radius:var(--rad-sm);}
  .ivh-share svg{stroke:#052E22;}
  .ivh-stat{background:var(--surf3); border:1px solid var(--line); border-radius:var(--rad-sm);}
  .ivh-stat.accepted{background:var(--surf3);}
  .ivh-lbl{color:var(--txt3);}
  .ivh-roster,.ivh-applybox input,.ivh-apply{border-color:var(--line);}
  .ivh-applybox input{background:var(--surf3);}
  .ivh-applybox button{background:rgba(52,211,153,.12); border-color:rgba(52,211,153,.35); color:var(--green);}

  /* CLIPPING hero — calm blue */
  .cliphero{background:linear-gradient(160deg,#122232,#0E141C 68%); border:1px solid rgba(77,166,255,.2);
    box-shadow:var(--shadow); border-radius:var(--rad);}
  .ch-eyebrow{color:var(--blue-hi);} .ch-eyebrow span{box-shadow:none; background:var(--blue);}
  .ch-step{background:var(--surf3); border:1px solid var(--line);} .ch-step b{background:var(--blue); color:#052440;}
  .ch-cta{background:var(--surf3); border:1px solid var(--line); color:var(--txt3);}

  /* TASK / nav rows — calm */
  .taskrow{border-radius:var(--rad-sm);}
  .tclaim{box-shadow:none;}
  /* compact activity row (withdrawal history) — smaller, not a big empty card */
  .navrow.acthist{background:var(--surf); border:1px solid var(--hair); border-radius:var(--rad-sm); padding:11px 13px; gap:11px;}
  .navrow.acthist .di{border-radius:9px; display:flex; align-items:center; justify-content:center;}
  .navrow.acthist .di svg{width:16px; height:16px;}
  .navrow.acthist .gl .n{font-size:14px;}
  .navrow.acthist .gl .s{font-size:11px; color:var(--txt3);}
  .navrow.acthist .ch{font-size:18px;}

  /* WITHDRAW page — full-page 3-method cash-out (no dialog). Sits ABOVE the sticky tab bar. */
  .page{z-index:60 !important;}
  .wd-hero{background:linear-gradient(160deg,#122232,#0E141C 70%); border:1px solid rgba(77,166,255,.22); border-radius:var(--rad); box-shadow:var(--shadow); padding:18px; margin-bottom:4px;}
  .wd-heye{font-size:10px; font-weight:800; letter-spacing:.16em; color:var(--blue-hi);}
  .wd-hbal{display:flex; align-items:center; gap:10px; font-family:'Teko','Rajdhani',sans-serif; font-weight:700; font-size:42px; line-height:.9; color:var(--txt); margin-top:5px;}
  .wd-hsub{font-size:11.5px; color:var(--txt3); margin-top:9px;}
  .wd-step{display:flex; align-items:center; gap:9px; margin:20px 2px 11px; font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:13.5px; color:var(--txt);}
  .wd-stepn{display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; border-radius:50%; background:var(--gold); color:#1a1400; font-size:12px; font-weight:800;}
  .wd-mlist{display:flex; flex-direction:column; gap:9px;}
  .wd-m{display:flex; flex-direction:column; align-items:flex-start; gap:2px; text-align:left; padding:14px 16px; border-radius:var(--rad-sm); background:var(--surf); border:1px solid var(--line); cursor:pointer; transition:border-color .15s,background .15s;}
  .wd-m.sel{border-color:var(--gold); background:rgba(232,180,74,.07);}
  .wm-name{font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:15px; color:var(--txt);}
  .wm-rate{font-size:12px; color:var(--txt2);}
  .wd-m.sel .wm-rate{color:var(--gold-hi);}
  .wd-tiers{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .wd-tier{display:flex; flex-direction:column; align-items:center; gap:4px; padding:14px 4px; border-radius:var(--rad-sm); background:var(--surf); border:1px solid var(--line); cursor:pointer; transition:border-color .15s;}
  .wd-tier.sel{border-color:var(--gold); background:rgba(232,180,74,.07);}
  .wd-tier.poor{opacity:.4;}
  .wt-pay{font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:14px; color:var(--txt);}
  .wt-cost{display:flex; align-items:center; gap:4px; font-size:11px; color:var(--txt3);}
  .wd-dest label{display:block; font-size:10.5px; letter-spacing:.08em; color:var(--txt3); text-transform:uppercase; margin:12px 2px 6px; font-weight:700;}
  .wd-dest input{width:100%; background:var(--surf); border:1px solid var(--line); border-radius:var(--rad-sm); color:var(--txt); padding:13px; font-size:15px;}
  .wd-dest input:focus{outline:none; border-color:var(--gold);}
  .wd-cta{width:100%; margin-top:18px; padding:15px; border:none; border-radius:var(--rad-sm); background:var(--blue); color:#052440; font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:15px; letter-spacing:.02em; cursor:pointer;}
  .wd-cta.off{background:var(--surf3); color:var(--txt3); cursor:default;}

  /* CONGRATULATIONS dialog — more exciting reward moment + bold gold button */
  .modal.cg{max-width:352px; padding:36px 24px 22px;
    background:radial-gradient(130% 85% at 50% -6%, rgba(255,206,90,.18), transparent 56%), linear-gradient(180deg,#171208,#0b0d10) !important;
    border:1px solid rgba(255,206,90,.4) !important; box-shadow:0 40px 100px -34px rgba(232,180,74,.6) !important;}
  .cg .cgburst{background:radial-gradient(circle, rgba(255,206,90,.4), rgba(45,212,167,.14) 46%, transparent 70%) !important;}
  .cg .cgkick{color:var(--green);}
  .cg .cgh{font-size:27px; background:linear-gradient(90deg,#FFE08A,#FFC24D 50%,#FFE08A) !important; -webkit-background-clip:text !important; background-clip:text !important; -webkit-text-fill-color:transparent !important;}
  .cg .cgamt{font-size:34px; margin-top:2px;}
  .cg .cgamt .cgnum{font-size:38px; font-family:'Teko','Rajdhani',sans-serif;}
  .cg .cgamt span{font-size:12px;}
  .cg .cgcta{background:linear-gradient(180deg,#FFE7A0,#F5B33C 52%,#E68A16) !important; color:#3a2400 !important; border:none !important;
    font-family:'Chakra Petch',sans-serif; font-weight:800 !important; font-size:15.5px !important; letter-spacing:.02em; padding:16px !important; border-radius:14px !important;
    box-shadow:0 14px 34px -10px rgba(232,180,74,.7), inset 0 1px 0 rgba(255,255,255,.45) !important; text-shadow:none !important;
    animation:cgbtnpulse 1.9s ease-in-out infinite;}
  .cg .cgcta:active{transform:scale(.985);}
  @keyframes cgbtnpulse{0%,100%{transform:scale(1);}50%{transform:scale(1.025);}}
  @media (prefers-reduced-motion:reduce){.cg .cgcta{animation:none;}}

  /* CLIP & EARN — exciting creator-campaign hero */
  .cliphero.live{position:relative; overflow:hidden; border-radius:20px; padding:22px 20px 20px;
    background:radial-gradient(120% 130% at 100% -10%, rgba(77,166,255,.22), transparent 55%), linear-gradient(155deg,#15263a,#0c1119 78%);
    border:1px solid rgba(77,166,255,.3); box-shadow:0 20px 46px -24px rgba(77,166,255,.55);}
  .ch-glow{position:absolute; top:-70px; right:-50px; width:220px; height:220px; border-radius:50%; pointer-events:none;
    background:radial-gradient(circle, rgba(255,206,90,.22), transparent 68%); animation:cgpulse 3.2s ease-in-out infinite;}
  .ch-badge{position:relative; z-index:1; display:inline-flex; align-items:center; gap:7px; font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:10.5px; letter-spacing:.14em; color:var(--blue-hi);}
  .ch-live{width:7px; height:7px; border-radius:50%; background:#34D399; box-shadow:0 0 9px #34D399; animation:peblink 1.6s ease-in-out infinite;}
  .ch-big{position:relative; z-index:1; display:flex; align-items:center; gap:14px; margin:12px 0 4px;}
  .ch-num{font-family:'Teko','Rajdhani',sans-serif; font-weight:700; font-size:72px; line-height:.8;
    background:linear-gradient(180deg,#FFE9A8,#FFC24D 55%,#E8901F); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; filter:drop-shadow(0 4px 16px rgba(232,180,74,.4));}
  .ch-per{font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:19px; line-height:1.05; color:var(--txt);}
  .ch-per span{display:block; font-family:'Inter',sans-serif; font-weight:500; font-size:12px; color:var(--txt2); margin-top:3px;}
  .ch-unli{position:relative; z-index:1; display:inline-flex; align-items:center; gap:7px; margin:10px 0 2px; padding:6px 12px; border-radius:20px;
    font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:11px; letter-spacing:.04em; color:var(--gold-hi);
    background:linear-gradient(180deg,rgba(232,180,74,.16),rgba(232,180,74,.06)); border:1px solid rgba(232,180,74,.42);}
  .ch-unli-i{width:6px; height:6px; border-radius:50%; background:var(--gold); box-shadow:0 0 8px var(--gold); animation:peblink 1.6s ease-in-out infinite;}
  .ch-lead{position:relative; z-index:1; font-size:12.5px; line-height:1.55; color:var(--txt2); margin:8px 0 16px; max-width:92%;}
  .ch-earn{position:relative; z-index:1; display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .ce{position:relative; text-align:center; padding:12px 6px 11px; border-radius:13px; background:rgba(255,255,255,.04); border:1px solid var(--line);}
  .ce-v{font-size:10.5px; font-weight:700; letter-spacing:.04em; color:var(--txt3); text-transform:uppercase;}
  .ce-d{font-family:'Rajdhani',sans-serif; font-weight:700; font-size:18px; color:var(--gold-hi); margin-top:4px; font-variant-numeric:tabular-nums;}
  .ce.hot{background:linear-gradient(180deg,rgba(232,180,74,.14),rgba(232,180,74,.04)); border-color:rgba(232,180,74,.5);}
  .ce-tag{position:absolute; top:-8px; left:50%; transform:translateX(-50%); font-size:8px; font-weight:800; letter-spacing:.1em; color:#3a2400; background:linear-gradient(180deg,#FFE08A,#F5B445); padding:2px 8px; border-radius:20px;}
  .ch-steps3{display:flex; gap:8px; margin:14px 0 4px;}
  .s3{flex:1; display:flex; align-items:center; gap:8px; padding:11px 10px; border-radius:12px; background:var(--surf); border:1px solid var(--hair); font-size:11.5px; font-weight:600; color:var(--txt); line-height:1.2;}
  .s3 b{display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; flex:none; border-radius:50%; background:var(--blue); color:#052440; font-size:11px;}
  .ch-submit{margin-top:16px;}
  .ch-sublbl{font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:14px; color:var(--txt); margin-bottom:10px;}
  .ch-submit input{width:100%; background:var(--surf3); border:1px solid var(--line); border-radius:12px; color:var(--txt); padding:13px; font-size:14px;}
  .ch-submit input:focus{outline:none; border-color:var(--gold);}
  .ch-hint{font-size:11.5px; color:var(--txt3); margin:9px 2px 12px; line-height:1.5;}
  .ch-go{width:100%; padding:15px; border:none; border-radius:13px; font-family:'Chakra Petch',sans-serif; font-weight:800; font-size:15px; letter-spacing:.02em; color:#3a2400; cursor:pointer;
    background:linear-gradient(180deg,#FFE7A0,#F5B33C 52%,#E68A16); box-shadow:0 12px 30px -10px rgba(232,180,74,.65), inset 0 1px 0 rgba(255,255,255,.4);}
  .ch-go:active{transform:translateY(1px);}
  .ch-msg{font-size:12.5px; margin-top:9px;}

  /* TOP CLIPPERS leaderboard */
  .lb{padding:6px 12px;}
  .lb-row{display:flex; align-items:center; gap:12px; padding:11px 2px;}
  .lb-row+.lb-row{border-top:1px solid var(--hair);}
  .lb-rank{flex:none; width:28px; height:28px; border-radius:9px; display:flex; align-items:center; justify-content:center;
    font-family:'Chakra Petch',sans-serif; font-weight:800; font-size:14px; color:var(--txt2); background:var(--surf3); border:1px solid var(--line);}
  .lb-rank.g1{background:linear-gradient(180deg,#FFE08A,#E8B44A); color:#3a2400; border:none;}
  .lb-rank.g2{background:linear-gradient(180deg,#e6ebf2,#aab4c2); color:#1a2230; border:none;}
  .lb-rank.g3{background:linear-gradient(180deg,#e6a86a,#b9793e); color:#241206; border:none;}
  .lb-mid{flex:1; min-width:0;}
  .lb-name{font-family:'Rajdhani',sans-serif; font-weight:700; font-size:15px; color:var(--txt); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .lb-views{font-size:11px; color:var(--txt3);}
  .lb-earn{flex:none; font-family:'Rajdhani',sans-serif; font-weight:700; font-size:16px; color:var(--gold-hi); font-variant-numeric:tabular-nums;}
  /* podium — top 3 */
  .lb-podium{display:flex; align-items:flex-end; justify-content:center; gap:8px; margin:6px 0 14px;}
  .lbp{flex:1; max-width:33%; display:flex; flex-direction:column; align-items:center; text-align:center; position:relative;}
  .lbp-crown{margin-bottom:2px; filter:drop-shadow(0 2px 6px rgba(255,206,90,.6)); animation:cgpulse 3s ease-in-out infinite;}
  .lbp-av{width:52px; height:52px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-family:'Teko','Rajdhani',sans-serif; font-weight:700; font-size:24px; color:var(--txt); background:linear-gradient(140deg,#27405e,#16222f); border:2px solid var(--line);}
  .lbp.p1 .lbp-av{width:62px; height:62px; font-size:28px; border-color:#FFD98A; box-shadow:0 8px 22px -8px rgba(232,180,74,.7);}
  .lbp.p2 .lbp-av{border-color:#c6cfdb;}
  .lbp.p3 .lbp-av{border-color:#d09a63;}
  .lbp-name{margin-top:7px; font-family:'Rajdhani',sans-serif; font-weight:700; font-size:13px; color:var(--txt); max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .lbp-earn{font-family:'Rajdhani',sans-serif; font-weight:700; font-size:15px; color:var(--gold-hi); margin-top:1px; font-variant-numeric:tabular-nums;}
  .lbp-views{font-size:9.5px; color:var(--txt3); margin-bottom:8px;}
  .lbp-bar{width:100%; border-radius:12px 12px 0 0; display:flex; align-items:flex-start; justify-content:center; padding-top:8px;
    font-family:'Chakra Petch',sans-serif; font-weight:800; color:rgba(0,0,0,.55);}
  .lbp-bar span{font-size:20px;}
  .lbp.p1 .lbp-bar{height:66px; background:linear-gradient(180deg,#FFE08A,#E8B44A); box-shadow:0 -6px 24px -8px rgba(232,180,74,.6);}
  .lbp.p2 .lbp-bar{height:48px; background:linear-gradient(180deg,#e6ebf2,#aab4c2);}
  .lbp.p3 .lbp-bar{height:38px; background:linear-gradient(180deg,#e6a86a,#b9793e);}
  /* ===== Sample clip card (TikTok-style preview) ===== */
  .clipsample{position:relative; display:flex; gap:13px; align-items:stretch; margin-top:12px; padding:12px; border-radius:18px; overflow:hidden; cursor:pointer;
    background:linear-gradient(135deg, rgba(37,244,238,.10), rgba(11,18,32,.4) 42%, rgba(254,44,85,.12)); border:1px solid rgba(254,44,85,.28);
    box-shadow:0 8px 24px rgba(0,0,0,.28); transition:transform .16s cubic-bezier(.22,.9,.27,1), box-shadow .2s ease;}
  .clipsample::before{content:''; position:absolute; inset:0; pointer-events:none; background:radial-gradient(140px 90px at 16% 30%, rgba(37,244,238,.18), transparent 70%);}
  .clipsample:active{transform:scale(.985); box-shadow:0 5px 16px rgba(0,0,0,.32);}
  .cs-thumb{position:relative; flex:0 0 auto; width:60px; aspect-ratio:9/16; border-radius:13px; overflow:hidden;
    background:linear-gradient(160deg,#25F4EE 0%, #0b1220 46%, #FE2C55 100%); display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 18px rgba(254,44,85,.35), inset 0 0 0 1px rgba(255,255,255,.12);}
  .cs-thumb::after{content:''; position:absolute; inset:0; background:linear-gradient(180deg, transparent 55%, rgba(0,0,0,.45));}
  .cs-play{position:relative; z-index:1; width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,.94); display:flex; align-items:center; justify-content:center; box-shadow:0 4px 12px rgba(0,0,0,.4); animation:cspulse 2s ease-in-out infinite;}
  .cs-play svg{width:14px; height:14px; margin-left:2px; fill:#0b1220; stroke:none;}
  @keyframes cspulse{0%,100%{transform:scale(1); box-shadow:0 4px 12px rgba(0,0,0,.4);} 50%{transform:scale(1.08); box-shadow:0 4px 18px rgba(255,255,255,.35);}}
  .cs-ribbon{position:absolute; top:7px; left:-1px; z-index:2; font-family:'Chakra Petch'; font-weight:700; font-size:7.5px; letter-spacing:1px; color:#fff; background:#FE2C55; padding:2px 6px; border-radius:0 6px 6px 0; box-shadow:0 2px 6px rgba(0,0,0,.3);}
  .cs-tk{position:absolute; bottom:6px; left:0; right:0; z-index:2; text-align:center; font-family:'Rajdhani'; font-weight:700; font-size:9px; letter-spacing:.5px; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.6);}
  .cs-mid{flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; gap:5px; position:relative; z-index:1;}
  .cs-t{font-family:'Rajdhani'; font-weight:700; font-size:15.5px; color:var(--txt); display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .cs-tag{font-family:'Chakra Petch'; font-weight:700; font-size:8px; letter-spacing:.8px; color:#04140f; background:var(--gold); padding:2px 6px; border-radius:5px;}
  .cs-s{font-size:11.5px; color:var(--txt2); line-height:1.4;}
  .cs-go{align-self:flex-start; margin-top:2px; display:inline-flex; align-items:center; gap:5px; font-family:'Rajdhani'; font-weight:700; font-size:12px; color:#fff;
    background:linear-gradient(135deg,#25F4EE,#FE2C55); padding:6px 12px; border-radius:10px; box-shadow:0 3px 10px rgba(254,44,85,.35);}
  .cs-go svg{width:13px; height:13px; fill:none; stroke:#fff; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round;}

  /* ── Watch me LIVE (TikTok live) — home promo card ── */
  .livehero{position:relative; overflow:hidden; display:flex; align-items:center; gap:13px; margin:0 0 12px; padding:15px 15px; border-radius:18px; cursor:pointer;
    background:linear-gradient(135deg,#12060c 0%,#0b0f14 55%,#04140f 100%); border:1px solid rgba(254,44,85,.34);
    box-shadow:0 10px 30px -14px rgba(254,44,85,.55), inset 0 1px 0 rgba(255,255,255,.04);}
  .livehero .lh-glow{position:absolute; inset:-40% -20% auto auto; width:180px; height:180px; border-radius:50%; pointer-events:none;
    background:radial-gradient(circle,rgba(37,244,238,.28),transparent 68%); filter:blur(6px);}
  .livehero .lh-tag{position:absolute; top:11px; right:12px; z-index:2; display:inline-flex; align-items:center; gap:5px;
    font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:8.5px; letter-spacing:1.4px; color:#fff;
    background:rgba(254,44,85,.92); padding:3px 8px; border-radius:20px; box-shadow:0 3px 12px rgba(254,44,85,.5);}
  .livehero .lh-dot{width:6px; height:6px; border-radius:50%; background:#fff; animation:lvblink 1.2s ease-in-out infinite;}
  .livehero .lh-ic{position:relative; z-index:1; flex:0 0 auto; width:50px; height:50px; border-radius:15px; display:grid; place-items:center;
    color:#fff; background:linear-gradient(135deg,rgba(37,244,238,.22),rgba(254,44,85,.22)); border:1px solid rgba(255,255,255,.14);
    box-shadow:0 0 0 4px rgba(254,44,85,.10), 0 6px 16px -6px rgba(37,244,238,.5); animation:lvpulse 2.2s ease-in-out infinite;}
  .livehero .lh-ic svg{width:26px; height:26px;}
  .livehero .lh-mid{flex:1; min-width:0; position:relative; z-index:1;}
  .livehero .lh-t{font-family:'Rajdhani',sans-serif; font-weight:700; font-size:16px; color:var(--txt); line-height:1.15;}
  .livehero .lh-s{font-size:11.5px; color:var(--txt2); line-height:1.4; margin-top:3px; max-width:30ch;}
  .livehero .lh-go{flex:0 0 auto; align-self:center; font-family:'Rajdhani',sans-serif; font-weight:700; font-size:12.5px; letter-spacing:.03em; color:#fff;
    background:linear-gradient(135deg,#25F4EE,#FE2C55); border:none; padding:9px 14px; border-radius:12px; cursor:pointer;
    box-shadow:0 5px 16px -4px rgba(254,44,85,.6); white-space:nowrap;}
  .livehero .lh-go:active{transform:scale(.96);}

  /* ── LIVE dialog ── */

function isSocial(t){ return /facebook\.com|fb\.watch|fb\.me/i.test(t.link||'')||/facebook|fb\b/i.test(t.title||''); }
// Download tasks = install / usage-verified offers (GearUp, boost, download-to-unlock).
// Everything else (social follow/comment, review, comment-on-video, daily/promo) is "Other".
function isDownloadTask(t){ return isUsage(t) || /install|download|gearup|warlito|boost/i.test((t.title||'')+' '+(t.desc||'')); }
function dwellSecs(t){ return Number(t.dwell)>0?Number(t.dwell):10; }

// withdrawal — Codashop style: lahat ng amount NAKALABAS na cards, tap para piliin (highlight),
// tapos ISANG button sa baba. WSEL = napiling tier cost (persisted across re-renders).
let WSEL=null;
let WMETHOD='mlbb';                 // withdraw method: mlbb | gcash | roblox
let WD_F={gid:'',srv:'',nm:''};     // preserve dest field values across in-page repaints
function withdrawPanel(s){
  const a=s.account;
  const avail=activeTiers(s);
  if(!avail.length) return $(`<div class="empty">No withdrawal tiers available right now.</div>`);
  const sel=ensureSel(s);  // kaparehong WSEL ng hero goal — naka-sync ang progress sa taas
  const can=a.balance>=sel.cost && !a.earnBanned;
  const wrap=$(`<div class="wd"></div>`);
  const grid=$(`<div class="tiers wsel"></div>`);
  avail.forEach(t=>{
    const ok=a.balance>=t.cost;
    const el=$(`<div class="tier sgrid ${t.cost===WSEL?'sel':''} ${ok?'':'poor'}">
      ${t.cost===WSEL?'<div class="selck">✓</div>':''}
      <span class="dia blue tg"></span><div class="n">${t.mlbb}</div><div class="u">MLBB</div>
      <div class="c"><span class="dia gold" style="width:14px;height:14px"></span>${t.cost.toLocaleString()}</div></div>`);
    el.onclick=()=>{ WSEL=t.cost; render(); };
    grid.appendChild(el);
  });
  wrap.appendChild(grid);
  const btn=$(`<button class="wdbtn ${can?'go':'off'}">${a.earnBanned?'EARNING DISABLED':can?('WITHDRAW '+sel.mlbb+' MLBB DIAMONDS'):('COLLECT '+(sel.cost-a.balance).toLocaleString()+' MORE POINTS')}</button>`);
  if(can) btn.onclick=()=>openWithdrawPage();
  else if(!a.earnBanned) btn.onclick=()=>toast('Collect '+(sel.cost-a.balance).toLocaleString()+' more points','bad');
  wrap.appendChild(btn);
  return wrap;
}

// Buong Withdraw page — goal hero + tier grid + payout proof. Nag-re-repaint sa tier select
// (hindi render() na nagre-rebuild ng dashboard sa likod) para di masira ang page.
function openWithdrawPage(){ openPage('Withdraw', body=>paintWithdraw(body)); }
// Payout in the target unit for a tier under the current method. 30 diamonds = P1 / 1 Robux.
// Per-method amount options. Pricing: 30 gold diamonds = 1 unit (P1 / 1 Robux / 1 MLBB diamond).
const WD_OPTS={ mlbb:[5,11,22,56,112], roblox:[50,100,200,400,800], gcash:[500,750,1000] };
function wdAmtLabel(method,u){ return method==='gcash' ? ('₱'+(+u).toLocaleString()) : ((+u).toLocaleString()+(method==='roblox'?' Robux':' MLBB')); }
function wdSelUnits(){ const o=WD_OPTS[WMETHOD]||WD_OPTS.mlbb; if(!o.includes(WSEL)) WSEL=o[0]; return WSEL; }
// Full Withdraw PAGE (no dialog): balance + 3 method cards + per-method amount + destination + one CTA.
function paintWithdraw(body){
  const s=STATE,a=s.account; body.textContent=''; const RATE=30;
  body.appendChild($(`<div class="wd-hero">
    <div class="wd-heye">CASH OUT BALANCE</div>
    <div class="wd-hbal"><span class="dia gold" style="width:22px;height:22px"></span>${a.balance.toLocaleString()}</div>
    <div class="wd-hsub">MLBB Diamonds &middot; GCash &middot; Roblox &nbsp;|&nbsp; 30 diamonds = &#8369;1 / 1 Robux / 1 MLBB diamond</div>
  </div>`));
  // STEP 1 — method
  body.appendChild($(`<div class="wd-step"><span class="wd-stepn">1</span>Choose method</div>`));
  const M=[['mlbb','MLBB Diamonds','Min 5 &middot; to your Game ID'],['gcash','GCash','Min &#8369;500 &middot; to your number'],['roblox','Roblox','Min 50 Robux &middot; to your username']];
  const methods=$(`<div class="wd-mlist"></div>`);
  M.forEach(([id,name,rate])=>{ const el=$(`<button type="button" class="wd-m ${id===WMETHOD?'sel':''}"><div class="wm-name">${name}</div><div class="wm-rate">${rate}</div></button>`);
    el.onclick=()=>{ if(WMETHOD!==id){ WMETHOD=id; WSEL=WD_OPTS[id][0]; WD_F={gid:'',srv:'',nm:''}; paintWithdraw(body); } };
    methods.appendChild(el); });
  body.appendChild(methods);
  // STEP 2 — amount (per method)
  const units=wdSelUnits();
  body.appendChild($(`<div class="wd-step"><span class="wd-stepn">2</span>Choose amount</div>`));
  const tiers=$(`<div class="wd-tiers"></div>`);
  (WD_OPTS[WMETHOD]||[]).forEach(u=>{ const cost=u*RATE, ok=a.balance>=cost;
    const el=$(`<button type="button" class="wd-tier ${u===WSEL?'sel':''} ${ok?'':'poor'}">
      <div class="wt-pay">${wdAmtLabel(WMETHOD,u)}</div>
      <div class="wt-cost"><span class="dia gold" style="width:11px;height:11px"></span>${cost.toLocaleString()}</div></button>`);
    el.onclick=()=>{ WSEL=u; paintWithdraw(body); };
    tiers.appendChild(el);
  });
  body.appendChild(tiers);
  // STEP 3 — destination
  body.appendChild($(`<div class="wd-step"><span class="wd-stepn">3</span>Where to send it</div>`));
  const dest=$(`<div class="wd-dest"></div>`);
  if(WMETHOD==='mlbb'){
    dest.innerHTML=`<label>GAME ID</label><input id="gid" inputmode="numeric" placeholder="e.g. 123456789">
      <label>SERVER ID</label><input id="srv" inputmode="numeric" placeholder="e.g. 1234"><div id="mlchk" style="min-height:18px;margin:6px 2px 0"></div>`;
  } else if(WMETHOD==='gcash'){
    dest.innerHTML=`<label>GCASH NUMBER</label><input id="gid" inputmode="numeric" placeholder="09XX XXX XXXX">
      <label>ACCOUNT NAME</label><input id="nm" placeholder="Full name on GCash">`;
  } else {
    dest.innerHTML=`<label>ROBLOX USERNAME</label><input id="gid" placeholder="Your Roblox username">`;
  }
  body.appendChild(dest);
  // restore + persist field values across repaints (e.g. changing amount)
  const bind=(id,key)=>{ const el=dest.querySelector('#'+id); if(!el) return; el.value=WD_F[key]||''; el.oninput=()=>{ WD_F[key]=el.value; }; };
  bind('gid','gid'); bind('srv','srv'); bind('nm','nm');
  if(WMETHOD==='mlbb') wireMlbb(dest.querySelector('#gid'),dest.querySelector('#srv'),dest.querySelector('#mlchk'));
  const err=$(`<div class="err" id="we" style="margin:12px 2px 0"></div>`); body.appendChild(err);
  // CTA
  const cost=units*RATE;
  const can=a.balance>=cost && !a.earnBanned;
  const cta=$(`<button class="wd-cta ${can?'':'off'}">${a.earnBanned?'Earning disabled':can?('Withdraw '+wdAmtLabel(WMETHOD,units)):('Collect '+(cost-a.balance).toLocaleString()+' more diamonds')}</button>`);
  cta.onclick=async()=>{
    if(a.earnBanned){ err.textContent='Earning is disabled on this account.'; return; }
    if(a.balance<cost){ toast('Collect '+(cost-a.balance).toLocaleString()+' more','bad'); return; }
    const gid=(WD_F.gid||'').trim(); let srv='';
    if(WMETHOD==='mlbb'){ srv=(WD_F.srv||'').trim();
      if(!gid){err.textContent='Enter your Game ID'; return;} if(!srv){err.textContent='Enter your Server ID'; return;} }
    else if(WMETHOD==='gcash'){ const nm=(WD_F.nm||'').trim();
      if(!gid){err.textContent='Enter your GCash number'; return;} if(!nm){err.textContent='Enter the account name'; return;} srv='gcash:'+nm; }
    else { if(!gid){err.textContent='Enter your Roblox username'; return;} srv='roblox'; }
    cta.textContent='Submitting…'; cta.disabled=true; err.textContent='';
    const r=await call('withdraw',units,cost,gid,srv);
    if(r&&r.ok){ WD_F={gid:'',srv:'',nm:''}; toast('Withdrawal submitted!','good'); requestState(); paintWithdraw(body); }
    else{ err.textContent=wdErr(r&&r.error); cta.disabled=false; cta.textContent='Withdraw '+wdAmtLabel(WMETHOD,units); }
  };
  body.appendChild(cta);
}

function openDailyDialog(){
  const s=STATE; if(!s) return; const c=s.config;
  const dAvail=s.dailyKnown && s.dailyAvailable;
  const mask=$(`<div class="ckmask"></div>`);
  const card=$(`<div class="ckcard">
    <button class="ckx" aria-label="Close">✕</button>
    <div class="ckbig"><svg viewBox="0 0 24 24" fill="none"><rect x="3.4" y="4.8" width="17.2" height="15.8" rx="3.2" stroke="#2DD4A7" stroke-width="1.7"/><path d="M3.4 9.4h17.2" stroke="#2DD4A7" stroke-width="1.7"/><path d="M8 2.8v3.2M16 2.8v3.2" stroke="#2DD4A7" stroke-width="1.7" stroke-linecap="round"/><path d="M8.3 14.7l2.5 2.5 4.9-4.9" stroke="#FFE08A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="cktitle">Daily check-in</div>
    <div class="ckreward"><span class="dia gold" style="width:26px;height:26px"></span>+${c.dailyBonus}</div>
    <div class="cksub" id="cksub">${dAvail?'Free points every day you show up. Claim yours now.':(s.dailyKnown?'':'Come back daily for free points.')}</div>
    <button class="ckgo ${dAvail?'':'off'}" id="ckgo">${dAvail?('CLAIM +'+c.dailyBonus):'CLAIMED TODAY'}</button>
  </div>`);
  const close=()=>{ if(cdT) clearInterval(cdT); mask.remove(); };
  mask.onclick=e=>{ if(e.target===mask) close(); };
  card.querySelector('.ckx').onclick=close;
  if(!dAvail && s.dailyKnown) startCountdown(card.querySelector('#cksub'), s.dailyMs);
  const go=card.querySelector('#ckgo');
  if(dAvail) go.onclick=async()=>{ go.textContent='…'; go.classList.add('off');
    const r=await call('claimDaily',c.dailyBonus);
    if(r&&r.ok){ gainFx(c.dailyBonus,'gold'); toast('Checked in! +'+c.dailyBonus,'good'); close(); }
    else{ toast('Try again','bad'); go.textContent='CLAIM +'+c.dailyBonus; go.classList.remove('off'); }
    requestState();
  };
  mask.appendChild(card); document.body.appendChild(mask);
}

async function submitClip(url){
  const msg=document.getElementById('clipMsg'); if(!msg) return;
  if(!url){ msg.textContent='Paste your TikTok link.'; msg.style.color='var(--danger)'; return; }
  msg.textContent='Submitting…'; msg.style.color='var(--txt2)';
  let r; try{ r=await fetch(CLIP_BASE+'/clipSubmit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({uid:STATE&&STATE.uid,url})}).then(x=>x.json()); }catch(e){ r={ok:false,error:'network'}; }
  if(r&&r.ok){ CLIP=null; loadClip(); toast('Clip submitted — we will review it soon.'); }
  else{ const e=r&&r.error; msg.style.color='var(--danger)';
    msg.textContent = e==='too_old'?'Submit within 1 hour of posting. This clip is older.':
      e==='dupe'?'This clip was already submitted.': e==='banned'?'Earning is disabled on this account.':
      e==='bad_url'?'Enter a valid TikTok link.': e==='disabled'?'Clipping is not live yet.':

let PSTACK=[];
function animClose(el, after){ if(!el||el._closing) return; el._closing=true; el.classList.add('closing'); setTimeout(()=>{ el.remove(); if(after) after(); },200); }

window.addEventListener('popstate', ()=>{ const p=PSTACK.pop(); if(p) animClose(p.el, p.after); });
// Back arrow → dumaan sa history para naka-sync sa hardware back (parehong smooth na daanan).
function closePage(el){ const top=PSTACK[PSTACK.length-1]; if(top && top.el===el){ history.back(); } else animClose(el); }

// Kunin ang reason ng bawat rejected withdrawal (server) — hindi kasama sa native history,
// kaya direktang fetch. Walang app update na kailangan; per-uid, non-sensitive fields lang.
async function fillRejectReasons(scope){
  try{
    const r=await fetch(MYW_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({uid:STATE.uid})}).then(x=>x.json());
    if(!r||!r.ok||!Array.isArray(r.items)) return;
    const map={}; r.items.forEach(it=>{ if(it && it.ts!=null) map[it.ts]=it; });
    scope.querySelectorAll('.litem.hi[data-st="rejected"], .litem.hi[data-st="refunded"]').forEach(row=>{
      const it=map[+row.getAttribute('data-ts')]; const det=row.querySelector('.rdet'); if(!det) return;
      const isRef=row.getAttribute('data-st')==='refunded';
      const fallback=isRef?'Hindi na available ang 5 Diamonds na promo (naubos na). Ibinalik ang iyong points.'
        :'Your withdrawal was declined after review. Please make sure you follow the fair-use rules.';
      const reason=(it&&it.reason)||fallback;
      const refunded=(it&&it.refunded)||isRef;
      det.innerHTML=`${esc(reason)}${refunded?' <b>Your points were refunded.</b>':' <b>Points were not refunded.</b>'}`;
    });
  }catch(e){}
}

function mlbbVerify(id,server){ return fetch(MLBB_CHECK_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,zone:server})}).then(r=>r.json()).catch(()=>({ok:false,error:'network'})); }
// I-wire ang dalawang input (id + server) sa isang output element. Auto-check (debounced)
// kapag valid ang format. Itinatago ang verified nick sa outEl.dataset.ign.
function wireMlbb(idEl,srvEl,outEl){
  let t=null,last='';
  const run=()=>{
    const id=(idEl.value||'').trim(),srv=(srvEl.value||'').trim();
    outEl.dataset.ign='';
    if(!/^\d{5,12}$/.test(id)||!/^\d{1,6}$/.test(srv)){ outEl.innerHTML=''; last=''; return; }
    const key=id+'_'+srv; if(key===last) return; last=key;
    outEl.innerHTML='<span style="color:var(--txt2);font-size:13px">Checking account…</span>';
    mlbbVerify(id,srv).then(r=>{
      if((idEl.value.trim()+'_'+srvEl.value.trim())!==key) return; // stale
      if(r&&r.ok&&r.nick){ outEl.dataset.ign=r.nick;
        outEl.innerHTML='<span style="display:inline-flex;align-items:center;gap:6px;color:#34d399;font-weight:700;font-size:13.5px"><span style="font-weight:900">✓</span>'+esc(r.nick)+'</span>'; }
      else { outEl.innerHTML='<span style="color:#f2a33c;font-size:13px">Account not found — i-check ang Game ID at Server</span>'; }
    });
  };
  const deb=()=>{ if(t)clearTimeout(t); t=setTimeout(run,500); };
  idEl.addEventListener('input',deb); srvEl.addEventListener('input',deb);
}

//=== withdrawal congratulations (excited na dialog kapag na-fulfill na) ============
// Sinusubaybayan ang history: kapag may withdrawal na naging "fulfilled" na hindi pa
// ni-celebrate, magpakita ng masiglang congrats + invite CTA. Sa UNANG load, tahimik na
// sini-seed ang lahat ng existing fulfilled (walang spam) — bagong fulfilled lang ang mag-t-trigger.
function maybeCongrats(s){
  try{
    const fulfilled=(s.history||[]).filter(h=>h && h.status==='fulfilled' && h.ts);
    if(!fulfilled.length) return;
    const KEY='santoryu_celebrated_ts';
    let seen; try{ seen=JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){ seen=null; }
    if(seen===null || !Array.isArray(seen)){
      localStorage.setItem(KEY, JSON.stringify(fulfilled.map(h=>h.ts)));
      return;
    }
    const seenSet=new Set(seen);
    // pinakabagong fulfilled na hindi pa ni-celebrate
    const fresh=fulfilled.slice().sort((a,b)=>(b.ts||0)-(a.ts||0)).find(h=>!seenSet.has(h.ts));
    if(!fresh) return;
    seen.push(fresh.ts); localStorage.setItem(KEY, JSON.stringify(seen));
    showCongrats(fresh);
  }catch(e){}
}

// ── "Run app for X minutes" task — verified by REAL foreground usage (UsageStatsManager) ──
function isUsage(t){ return (+t.usageSecs)>0 && !!t.verifyPkg; }
function usageSupported(){ return isNative && window.Android && typeof window.Android.usageSeconds==='function'; }
function fmtDur(s){ s=+s||0; return (s>=60&&s%60===0)?(s/60)+' min':(s>=60?Math.floor(s/60)+'m '+(s%60)+'s':s+'s'); }
function openUsage(t){
  const need=+t.usageSecs, pkg=t.verifyPkg;
  let startTs=0, busy=false;
  const ov=$(`<div class="ov"><div class="modal">
    <h3>${esc(t.title)}</h3>
    <p>Tap <b>Open app</b>, then actually use it for <b>${fmtDur(need)}</b>. Come back and claim <b>+${t.reward}</b> diamonds. We verify real usage — no shortcuts.</p>
    <div class="err" id="ue"></div>
    <div id="uprog" style="font-size:13px;color:var(--txt2);margin:8px 0 2px">Tap Open app to start.</div>
    <div id="ugrant" style="display:none;margin:8px 0"><button class="btn" id="ugrantb" style="width:100%">Grant usage access</button></div>
    <div class="mrow"><button class="btn ghost" id="uopen">Open app</button><button class="btn go" id="uok" disabled>Use ${fmtDur(need)}</button></div></div></div>`);
  document.body.appendChild(ov);
  const ok=ov.querySelector('#uok'), prog=ov.querySelector('#uprog'), grant=ov.querySelector('#ugrant');
  // Progress display only — the CLAIM is re-verified natively (claimUsageTask), so a stale
  // display can never grant the reward. usageSeconds counts only from startTs (fresh session).
  async function refresh(){
    if(busy||!startTs) return;
    let r; try{ r=await call('usageSeconds', pkg, String(startTs)); }catch(e){ r=null; }
    if(!r || !r.hasAccess){ grant.style.display='block'; ok.disabled=true; prog.textContent='Enable usage access so we can verify your time.'; return; }
    grant.style.display='none';
    const secs=Math.max(0, Math.min(+r.secs||0, need));
    if(secs>=need){ ok.disabled=false; ok.textContent='Claim +'+t.reward; prog.textContent='Verified '+fmtDur(need)+' — you can claim now.'; }
    else{ ok.disabled=true; ok.textContent='Use '+fmtDur(need); prog.textContent='Used '+fmtDur(secs)+' / '+fmtDur(need)+' — keep the app open, then come back.'; }
  }
  ov.querySelector('#uopen').onclick=()=>{ startTs=Date.now(); const link=(t.link&&t.link!=='#')?t.link:('market://details?id='+pkg); window.Android.openLink(link); prog.textContent='Timing started — use the app for '+fmtDur(need)+', then come back.'; };
  ov.querySelector('#ugrantb').onclick=()=>{ if(window.Android.openUsageSettings) window.Android.openUsageSettings(); };
  ok.onclick=async()=>{
    if(ok.disabled||busy) return; busy=true; ok.textContent='…'; ok.disabled=true;
    let r; try{ r=await call('claimUsageTask', t.id, pkg, need, t.reward, String(startTs)); }catch(e){ r=null; }
    busy=false;
    if(r&&r.ok){ close(); gainFx(t.reward,'gold'); toast('Verified! +'+t.reward,'good'); requestState(); return; }
    if(r&&r.error==='not_used'){ prog.textContent='Only '+fmtDur(Math.min(+r.secs||0,need))+' so far — use the app for the full '+fmtDur(need)+'.'; refresh(); }
    else if(r&&r.error==='no_access'){ grant.style.display='block'; ok.disabled=true; ok.textContent='Use '+fmtDur(need); prog.textContent='Enable usage access to verify.'; }
    else{ close(); toast(r&&r.error==='already_claimed'?'Already claimed':'Could not verify — try again','bad'); requestState(); }
  };
  const onVis=()=>{ if(!document.hidden && document.body.contains(ov)) refresh(); };
  document.addEventListener('visibilitychange', onVis);
  function close(){ document.removeEventListener('visibilitychange', onVis); ov.remove(); }
  ov.onclick=e=>{ if(e.target===ov) close(); };
  // Surface the grant prompt up-front if usage access isn't enabled yet.
  (async()=>{ let r; try{ r=await call('usageSeconds', pkg, "0"); }catch(e){ r=null; } if(r&&!r.hasAccess){ grant.style.display='block'; prog.textContent='Enable usage access, then tap Open app.'; } })();
}

function cmPick(a){ return a[Math.floor(Math.random()*a.length)]; }
function cmBuild(){
  var s;

    s=cmPick(CM_REQPRE)+cmPick(CM_REQ);

    var join=Math.random()<0.4?", ":" ";

  }
  return s;
}

    toast('Complete the task first','bad'); cmRerender(t);
  }
}

// ── Tongits Go campaign (gold hero → 6-step ladder: install, register, day 1-4) ──
// Owner-scoped via campaign.testUids while under test; native verifies everything server-side.
let TG_START=0; // startTs for the day currently being played (reset per claim attempt)
let TG_ACCESS; // undefined=unknown, true/false = Usage Access state (gates Day-play after register)
let TG_VISBOUND=false;
// Ask the native bridge whether Usage Access is granted, then rerender to lock/unlock Day play.
async function tongitsCheckAccess(){
  const c=STATE&&STATE.campaign; if(!c) return;
  if(!(window.Android&&window.Android.usageSeconds)){ TG_ACCESS=true; } // old app w/o bridge — don't block
  else{ try{ const u=await call('usageSeconds', c.package||'', '0'); TG_ACCESS=!!(u&&u.hasAccess); }catch(e){ TG_ACCESS=undefined; } }
  const b=document.getElementById('tgpagebody'); if(b) renderTongitsPage(b);
}
function tongitsOwnerOk(c,uid){ return !Array.isArray(c.testUids) || c.testUids.length===0 || c.testUids.indexOf(uid)>=0; }
function tongitsEligible(s){
  const c=s&&s.campaign;
  return !!(c && c.enabled===true && usageSupported() && !(s.campaignState && s.campaignState.done) && tongitsOwnerOk(c, s.uid));
}
function tongitsTotalReward(c){
  let t=(+((c.install||{}).reward)||0)+(+((c.register||{}).reward)||0);
  (c.days||[]).forEach(d=>{ t+=(+((d||{}).reward)||0); });
  return t;
}
function sameLocalDay(a,b){ a=new Date(+a||0); b=new Date(+b||0); return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate(); }
// Derives the ladder's live UI state purely from campaign + campaignState (no polling needed).
function tongitsProgress(c,cs){
  cs=cs||{};
  const installed=!!cs.installClaimedAt;
  const reg=(cs.register&&cs.register.status)||'none';
  const regApproved=reg==='approved';
  const streak=(cs.streak&&cs.streak.current)||0;
  const daysClaimed=cs.daysClaimed||{};
  const daysTotal=(Array.isArray(c.days)&&c.days.length)?c.days.length:4;
  const lastClaimTs=streak>0?daysClaimed[String(streak)]:0;
  const claimedToday=streak>0 && !!lastClaimTs && sameLocalDay(lastClaimTs, Date.now());
  const nextDay=Math.min(streak+1, daysTotal);
  const allDaysDone=streak>=daysTotal;
  const done=!!cs.done || (regApproved && allDaysDone);
  return {installed,reg,regApproved,streak,daysClaimed,daysTotal,claimedToday,nextDay,allDaysDone,done};
}
