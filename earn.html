<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Santoryu — Earn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Rajdhani:wght@500;600;700&family=Teko:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#E8B44A; --gold-hi:#FFE08A; --gold-deep:#A9781F;
    --blue:#4DA6FF; --blue-hi:#9BD4FF; --blue-deep:#1E63B0; --cyan:#5FE6FF;
    --emerald:#2DD4A7;
    --bg:#07090C; --surf:#11151B; --surf2:#161B22; --line:#222a34;
    --txt:#EDF1F5; --txt2:#8A95A3; --danger:#FF5E6C; --amber:#F5B445; --green:#34D399;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;}
  html,body{background:var(--bg);}
  body{font-family:'Inter',sans-serif; color:var(--txt); padding:14px 14px 34px; max-width:440px; margin:0 auto;
    background:radial-gradient(120% 36% at 50% -4%, rgba(77,166,255,.06), transparent 60%), var(--bg);}
  .hide{display:none !important;}

  /* diamonds = REAL provided asset (diamond.webp). BLUE = MLBB (withdraw), GOLD = points (tinted) */
  .dia{display:inline-block; vertical-align:middle; background-position:center; background-repeat:no-repeat; background-size:contain;}
  .dia.blue{background-image:url('gem-blue.png');}
  .dia.gold{background-image:url('gem-gold.png');}

  /* header (now in HTML) */
  .head{display:flex; align-items:center; justify-content:space-between; padding:4px 2px 0; margin-bottom:15px;}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .logo{width:34px;height:34px;border-radius:10px; display:flex;align-items:center;justify-content:center;
    background:linear-gradient(150deg,#1c2128,#0c0f14); border:1px solid rgba(232,180,74,.4); box-shadow:0 4px 14px -4px rgba(232,180,74,.4);}
  .brand h1{font-family:'Chakra Petch'; font-weight:700; font-size:21px; letter-spacing:.5px; line-height:1;}
  .brand small{display:block; font-family:'Rajdhani'; font-weight:600; font-size:10px; letter-spacing:3px; color:var(--txt2); margin-top:2px;}
  .balpill{display:flex; align-items:center; gap:8px; background:linear-gradient(180deg,rgba(232,180,74,.14),rgba(232,180,74,.05));
    border:1px solid rgba(232,180,74,.4); padding:8px 14px; border-radius:30px; box-shadow:0 4px 14px -6px rgba(232,180,74,.5); transition:transform .2s;}
  .balpill.bump{animation:bump .5s ease;}
  @keyframes bump{0%,100%{transform:scale(1);}35%{transform:scale(1.16);}}
  .balpill .v{font-family:'Rajdhani'; font-weight:700; font-size:18px; color:var(--gold-hi);}

  /* HERO (BLUE = MLBB diamonds) */
  .hero{position:relative; border-radius:22px; overflow:hidden; padding:18px;
    background:linear-gradient(100deg, rgba(8,11,16,.94) 26%, rgba(8,11,16,.55) 58%, rgba(8,11,16,.25) 100%), url('hero-with.jpg') center/cover #080b10;
    border:1px solid rgba(77,166,255,.40); box-shadow:0 14px 40px -14px rgba(77,166,255,.34), inset 0 1px 0 rgba(255,255,255,.08);}
  .eyebrow{font-family:'Chakra Petch'; font-weight:700; font-size:10.5px; letter-spacing:3px; color:var(--cyan); text-shadow:0 0 12px rgba(95,230,255,.5);}
  .reward{display:flex; align-items:center; gap:10px; margin-top:2px;}
  .num{font-family:'Teko'; font-weight:700; font-size:72px; line-height:.8; color:var(--blue-hi); text-shadow:0 2px 16px rgba(77,166,255,.45);}
  .rlabel{font-family:'Rajdhani'; line-height:1.05;}
  .rlabel .a{font-weight:700; font-size:23px; letter-spacing:1px; display:block;}
  .rlabel .b{font-weight:600; font-size:14px; letter-spacing:4.5px; color:var(--txt2); display:block; margin-top:1px;}
  .sub{font-size:11px; color:var(--txt2); margin-top:10px; font-weight:500; max-width:185px; line-height:1.4;}
  .emblem{display:none;}
  @keyframes floaty{0%,100%{transform:translateY(-44%);}50%{transform:translateY(-37%);}}
  .prog{margin-top:14px;}
  .prow{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:6px;}
  .prow .l{font-family:'Chakra Petch'; font-weight:600; font-size:9.5px; letter-spacing:3px; color:var(--txt2);}
  .prow .r{font-family:'Rajdhani'; font-weight:700; font-size:14px; color:var(--cyan);}
  .track{height:10px; border-radius:6px; background:rgba(255,255,255,.07); box-shadow:inset 0 1px 2px rgba(0,0,0,.5); overflow:hidden;}
  .fill{height:100%; border-radius:6px; background:linear-gradient(90deg,var(--emerald),var(--cyan)); box-shadow:0 0 10px rgba(95,230,255,.6); width:0; transition:width 1s cubic-bezier(.2,.8,.2,1);}
  .cta{margin-top:15px; height:46px; border-radius:13px; border:1px solid rgba(155,212,255,.6); display:flex; align-items:center; justify-content:center; gap:9px; cursor:pointer;
    background:linear-gradient(180deg,var(--blue-hi),var(--blue) 45%,var(--blue-deep)); box-shadow:0 7px 18px -4px rgba(77,166,255,.5), inset 0 1px 0 rgba(255,255,255,.5);}
  .cta:active{transform:scale(.98);}
  .cta.off{background:var(--surf2); border-color:var(--line); box-shadow:none; cursor:default;}
  .cta span{font-family:'Chakra Petch'; font-weight:700; font-size:14px; letter-spacing:3px; color:#04121f;}
  .cta.off span{color:var(--txt2); letter-spacing:1px;}

  .sh{display:block; margin:22px 2px 11px; overflow:hidden;}
  .sh .t{font-family:'Chakra Petch'; font-weight:700; font-size:12px; letter-spacing:2px; color:var(--txt2); float:left;}
  .sh .x{font-size:11px; color:var(--gold); font-weight:600; float:right;}
  .sh .x.blue{color:var(--cyan);}

  .tiers{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
  .tier{background:var(--surf); border:1px solid var(--line); border-radius:13px; padding:11px 4px 9px; text-align:center; cursor:pointer; transition:transform .12s,border-color .2s;}
  .tier:active{transform:scale(.95);}
  .tier.lock{border-color:rgba(77,166,255,.5); background:linear-gradient(180deg,rgba(77,166,255,.10),var(--surf));}
  .tier.used{opacity:.4; cursor:default;}
  .tier .tg{width:24px;height:24px;margin:0 auto 6px;}
  .tier .n{font-family:'Teko'; font-weight:600; font-size:23px; line-height:.8;}
  .tier .u{font-size:8px; letter-spacing:1px; color:var(--txt2); margin-top:2px;}
  .tier .c{margin-top:7px; font-family:'Rajdhani'; font-weight:700; font-size:12px; color:var(--gold); border-top:1px solid var(--line); padding-top:6px; display:flex; align-items:center; justify-content:center; gap:4px;}
  /* withdraw — Codashop-style selectable grid + single button */
  .wd{margin-bottom:4px;}
  .tiers.wsel{grid-template-columns:repeat(3,1fr);}
  .tier.sgrid{position:relative; cursor:pointer; padding:13px 4px 11px;}
  .tier.sgrid.sel{border-color:#4DA6FF; background:linear-gradient(180deg,rgba(77,166,255,.14),var(--surf)); box-shadow:0 0 0 1.5px rgba(77,166,255,.55), 0 8px 20px rgba(77,166,255,.18);}
  .tier.sgrid.poor{opacity:.45;}
  .tier .selck{position:absolute; top:6px; right:7px; width:17px; height:17px; border-radius:50%; background:#4DA6FF; color:#06223f; font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center;}
  .wdbtn{width:100%; margin-top:13px; border:none; border-radius:14px; padding:16px; font-family:'Chakra Petch'; font-weight:700; font-size:13.5px; letter-spacing:.8px; cursor:pointer;}
  .wdbtn.go{background:linear-gradient(180deg,#3BE0B6,#1FB892); color:#06231b; box-shadow:0 8px 22px rgba(45,212,167,.32);}
  .wdbtn.go:active{transform:translateY(1px);}
  .wdbtn.off{background:rgba(255,255,255,.05); color:var(--txt2); cursor:default;}

  .card{background:var(--surf); border:1px solid var(--line); border-radius:15px; padding:14px;}
  .rowflex{display:flex; align-items:center; gap:12px;}
  .di{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto; overflow:hidden;}
  .di svg{width:21px;height:21px;}
  .di img{width:100%;height:100%;object-fit:cover;}
  .icimg{width:28px;height:28px;object-fit:contain;display:block;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4));}
  .gleft{flex:1; min-width:0;}
  .gleft .n{font-family:'Rajdhani'; font-weight:700; font-size:16px; line-height:1.15;}
  .gleft .d{font-size:11px; color:var(--txt2); margin-top:1px;}
  .act{font-family:'Rajdhani'; font-weight:700; font-size:13px; letter-spacing:.5px; padding:9px 16px; border-radius:10px; cursor:pointer; white-space:nowrap; border:none; transition:transform .12s;}
  .act:active{transform:scale(.94);}
  .act.on{background:linear-gradient(90deg,var(--emerald),var(--gold)); color:#04140f;}
  .act.off{background:var(--surf2); color:var(--txt2); cursor:default;}

  /* invite: code + copy + share + share link + apply code */
  .inv .row1{display:flex; align-items:center; gap:8px;}
  .code{flex:1; font-family:'Chakra Petch'; font-weight:700; font-size:15px; letter-spacing:1px; color:var(--emerald); background:#0d1117; border:1px dashed rgba(45,212,167,.4); border-radius:9px; padding:10px 12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .icb{width:42px;height:42px;flex:0 0 auto;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;transition:transform .12s;}
  .icb:active{transform:scale(.9);}
  .icb svg{width:19px;height:19px;}
  .icb.copy{background:rgba(232,180,74,.14); border:1px solid rgba(232,180,74,.4);}
  .icb.copy svg{stroke:var(--gold);}
  .share2{display:flex; gap:8px; margin-top:9px;}
  .sbtn{flex:1; display:flex; align-items:center; justify-content:center; gap:7px; font-family:'Rajdhani'; font-weight:700; font-size:13px; letter-spacing:.5px; padding:11px; border-radius:10px; border:none; cursor:pointer; transition:transform .12s;}
  .sbtn:active{transform:scale(.96);}
  .sbtn.code{background:linear-gradient(180deg,var(--emerald),#1aa583); color:#04140f;}
  .sbtn.link{background:rgba(95,230,255,.12); border:1px solid rgba(95,230,255,.35); color:var(--cyan);}
  .sbtn svg{width:15px;height:15px;}
  .applywrap{margin-top:11px; padding-top:12px; border-top:1px solid var(--line);}
  .applylbl{font-size:11px; color:var(--txt2); margin-bottom:8px;}
  .applybox{display:flex; gap:8px;}
  .appliedbox{display:flex; align-items:center; gap:11px; margin-top:11px; padding-top:12px; border-top:1px solid var(--line);}
  .appliedbox .ckc{width:25px;height:25px;border-radius:50%;background:var(--emerald);color:#04140f;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:0 0 auto;}
  .appliedbox .apl{flex:1;min-width:0;}
  .appliedbox .apt{font-size:10px;letter-spacing:1.5px;color:var(--emerald);font-weight:700;font-family:'Chakra Petch';}
  .appliedbox .apc2{font-family:'Chakra Petch';font-weight:700;font-size:15px;letter-spacing:1px;color:var(--txt);margin-top:2px;}
  .appliedbox .lock{font-size:14px;opacity:.5;flex:0 0 auto;}
  .applybox input{flex:1; background:#0d1117; border:1px solid var(--line); border-radius:9px; padding:10px 12px; color:var(--txt); font-size:13px; font-family:'Chakra Petch'; letter-spacing:1px; text-transform:uppercase;}
  .applybox input:focus{outline:none; border-color:var(--emerald);}
  .applybox button{background:rgba(45,212,167,.15); border:1px solid rgba(45,212,167,.4); color:var(--emerald); font-family:'Rajdhani'; font-weight:700; padding:0 16px; border-radius:9px; cursor:pointer;}

  /* lists: history + invited */
  .litem{display:flex; align-items:center; gap:11px; padding:11px 2px; border-bottom:1px solid rgba(34,42,52,.6);}
  .litem:last-child{border-bottom:none;}
  .litem .nm{flex:1; font-family:'Rajdhani'; font-weight:600; font-size:14px;}
  .litem .sm{font-size:11px; color:var(--txt2);}
  .stat{font-family:'Rajdhani'; font-weight:700; font-size:11px; letter-spacing:1px; padding:4px 9px; border-radius:7px;}
  .stat.pending{background:rgba(245,180,69,.14); color:var(--amber);}
  .stat.fulfilled{background:rgba(52,211,153,.14); color:var(--green);}
  .stat.rejected{background:rgba(255,94,108,.14); color:var(--danger);}
  .empty{text-align:center; color:var(--txt2); font-size:12px; padding:16px 0;}

  /* nav rows (open sub-pages) */
  .navrow{display:flex; align-items:center; gap:12px; padding:13px 2px; cursor:pointer;}
  .navrow+.navrow{border-top:1px solid rgba(34,42,52,.6);}
  .navrow:active{opacity:.6;}
  .navrow .gl{flex:1;}
  .navrow .gl .n{font-family:'Rajdhani'; font-weight:700; font-size:16px;}
  .navrow .gl .s{font-size:11px; color:var(--txt2); margin-top:1px;}
  .navrow .ch{color:var(--txt2); font-size:22px; font-weight:300;}
  /* sub-page */
  .page{position:fixed; inset:0; background:var(--bg); z-index:25; overflow-y:auto; padding:14px 14px 30px; animation:slidein .26s cubic-bezier(.22,.9,.27,1); will-change:transform,opacity;}
  @keyframes slidein{from{transform:translateX(34px); opacity:0;}to{transform:translateX(0); opacity:1;}}
  .page.closing{animation:slideout .2s cubic-bezier(.4,0,.7,.3) forwards; pointer-events:none;}
  @keyframes slideout{from{transform:translateX(0); opacity:1;}to{transform:translateX(34px); opacity:0;}}
  .pgh{display:flex; align-items:center; gap:12px; margin-bottom:14px; padding-top:2px;}
  .pgback{width:40px;height:40px;border-radius:11px;background:var(--surf);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;}
  .pgback svg{width:20px;height:20px;color:var(--txt);}
  .pgback:active{transform:scale(.92);}
  .pgh h2{font-family:'Chakra Petch'; font-weight:700; font-size:18px;}

  .badge{display:flex; align-items:center; gap:5px; background:rgba(232,180,74,.12); padding:6px 10px; border-radius:9px; border:1px solid rgba(232,180,74,.2);}
  .badge b{font-family:'Rajdhani'; font-weight:700; font-size:12px; color:var(--gold);}

  /* modal */
  .ov{position:fixed; inset:0; background:rgba(0,0,0,.74); display:flex; align-items:center; justify-content:center; padding:24px; z-index:30; animation:fade .2s ease;}
  /* earn gate warning banner */
  .banwarn{display:flex; gap:11px; align-items:flex-start; background:rgba(255,94,108,.10); border:1px solid rgba(255,94,108,.4);
    border-radius:14px; padding:13px 14px; margin:2px 0 14px;}
  .banwarn .bwic{width:22px;height:22px;flex:0 0 auto;border-radius:50%;background:var(--danger);color:#fff;font-weight:900;
    display:flex;align-items:center;justify-content:center;font-size:14px;margin-top:1px;}
  .banwarn .bwt{font-weight:800;color:var(--danger);font-size:13.5px;letter-spacing:.01em;}
  .banwarn .bwd{color:var(--txt2);font-size:12px;line-height:1.5;margin-top:3px;}
  /* withdrawal congratulations */
  .ov.congrats{z-index:60;}
  .modal.cg{position:relative; overflow:hidden; text-align:center; max-width:340px; padding:30px 24px 22px;
    background:linear-gradient(180deg,#101a16,#0b0f13); border:1px solid rgba(45,212,167,.35);}
  .cg .cgburst{position:absolute; top:-70px; left:50%; transform:translateX(-50%); width:260px; height:260px; pointer-events:none;
    background:radial-gradient(circle, rgba(45,212,167,.35), rgba(95,160,255,.14) 45%, transparent 68%); animation:cgpulse 2.4s ease-in-out infinite;}
  @keyframes cgpulse{0%,100%{opacity:.75; transform:translateX(-50%) scale(1);}50%{opacity:1; transform:translateX(-50%) scale(1.08);}}
  .cg .cgmedal{position:relative; width:74px; height:74px; margin:2px auto 12px; border-radius:50%;
    background:radial-gradient(circle at 50% 35%, rgba(95,160,255,.28), rgba(45,212,167,.14)); display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 30px -8px rgba(95,160,255,.6); animation:cgpop .5s cubic-bezier(.2,1.4,.4,1) both;}
  @keyframes cgpop{0%{transform:scale(.4); opacity:0;}100%{transform:scale(1); opacity:1;}}
  .cg .cgkick{position:relative; font-size:11px; font-weight:800; letter-spacing:.16em; color:var(--emerald);}
  .cg .cgh{position:relative; font-size:24px; font-weight:900; letter-spacing:.01em; margin:5px 0 10px; color:var(--txt);
    background:linear-gradient(90deg,#5fa0ff,#2dd4a7); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;}
  .cg .cgamt{position:relative; font-size:26px; font-weight:900; color:var(--txt); display:flex; align-items:center; justify-content:center; gap:8px;}
  .cg .cgamt span{font-size:12px; font-weight:800; letter-spacing:.08em; color:var(--txt2); align-self:center;}
  .cg .cgmsg{position:relative; color:var(--txt2); font-size:12.5px; line-height:1.55; margin:9px 4px 18px;}
  .cg .cgcta{position:relative; width:100%;}
  .cg .cgclose{position:relative; display:block; width:100%; margin-top:9px; background:none; border:none; color:var(--txt2);
    font-size:12.5px; font-weight:700; padding:8px; cursor:pointer;}
  @keyframes fade{from{opacity:0;}to{opacity:1;}}
  .modal{width:100%; max-width:340px; background:linear-gradient(160deg,var(--surf2),var(--bg)); border:1px solid rgba(95,200,255,.32); border-radius:20px; padding:20px; animation:pop .3s cubic-bezier(.2,1.3,.4,1);}
  @keyframes pop{from{opacity:0; transform:scale(.85);}to{opacity:1; transform:scale(1);}}
  .modal h3{font-family:'Chakra Petch'; font-weight:700; font-size:17px; margin-bottom:3px;}
  .modal p{font-size:12px; color:var(--txt2); margin-bottom:6px; line-height:1.45;}
  .modal label{font-size:10px; letter-spacing:2px; color:var(--txt2); font-weight:600; display:block; margin:12px 2px 5px;}
  .modal input,.modal textarea{width:100%; background:#0d1117; border:1px solid var(--line); border-radius:10px; padding:11px 12px; color:var(--txt); font-size:14px; font-family:'Inter'; resize:none;}
  .modal input:focus,.modal textarea:focus{outline:none; border-color:var(--cyan);}
  .mrow{display:flex; gap:10px; margin-top:18px;}
  .mrow .btn{flex:1; text-align:center; padding:12px; font-size:13px; font-family:'Rajdhani'; font-weight:700; border-radius:11px; border:none; cursor:pointer; letter-spacing:.5px;}
  .btn.ghost{background:var(--surf2); color:var(--txt2);}
  .btn.go{background:linear-gradient(180deg,var(--blue-hi),var(--blue-deep)); color:#04121f;}
  .btn.go:disabled{opacity:.45;}
  .err{color:var(--danger); font-size:12px; margin-top:10px; min-height:14px;}

  /* custom toast */
  #toasts{position:fixed; left:0; right:0; bottom:26px; display:flex; flex-direction:column; align-items:center; gap:8px; z-index:50; pointer-events:none;}
  .ctoast{display:flex; align-items:center; gap:9px; background:#12161c; border:1px solid var(--line); color:var(--txt);
    font-family:'Rajdhani'; font-weight:600; font-size:14px; padding:11px 16px; border-radius:13px; box-shadow:0 10px 30px rgba(0,0,0,.5); animation:tin .3s cubic-bezier(.2,1.3,.4,1);}
  .ctoast.good{border-color:rgba(45,212,167,.5);} .ctoast.bad{border-color:rgba(255,94,108,.5);}
  .ctoast .ic{width:20px;height:20px;display:flex;align-items:center;justify-content:center;border-radius:50%;flex:0 0 auto;font-size:12px;font-weight:800;}
  .ctoast.good .ic{background:rgba(45,212,167,.2); color:var(--emerald);} .ctoast.bad .ic{background:rgba(255,94,108,.2); color:var(--danger);}
  @keyframes tin{from{opacity:0; transform:translateY(16px);}to{opacity:1; transform:translateY(0);}}
  .ctoast.out{animation:tout .3s ease forwards;}
  @keyframes tout{to{opacity:0; transform:translateY(16px);}}

  /* reward reveal (treasure chest pop) */
  .rewardpop{position:fixed; inset:0; z-index:45; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none; background:radial-gradient(closest-side, rgba(0,0,0,.5), transparent 70%); animation:rpfade 1.6s ease forwards;}
  @keyframes rpfade{0%{opacity:0;}12%{opacity:1;}80%{opacity:1;}100%{opacity:0;}}
  .rpchest{width:172px;height:172px;filter:drop-shadow(0 0 36px rgba(255,210,120,.6));animation:rpchest 1s cubic-bezier(.2,1.4,.4,1) both;}
  @keyframes rpchest{0%{opacity:0;transform:scale(.4) translateY(24px) rotate(-6deg);}45%{opacity:1;transform:scale(1.08) rotate(2deg);}100%{opacity:1;transform:scale(1) rotate(0);}}
  .rpamt{font-family:'Teko';font-weight:700;font-size:50px;line-height:1;color:#FFE08A;text-shadow:0 0 20px rgba(232,180,74,.8);margin-top:2px;display:flex;align-items:center;gap:9px;animation:rpamt 1.6s ease both;}
  .rpamt .dia{width:30px;height:30px;}
  @keyframes rpamt{0%{opacity:0;transform:translateY(14px);}30%{opacity:1;transform:translateY(0);}82%{opacity:1;}100%{opacity:0;transform:translateY(-26px);}}

function withdrawPanel(s){
  const a=s.account;

  if(!avail.length) return $(`<div class="empty">No withdrawal tiers available right now.</div>`);
  const sel=ensureSel(s);  // kaparehong WSEL ng hero goal — naka-sync ang progress sa taas
  const can=a.balance>=sel.cost && !a.earnBanned;
  const wrap=$(`<div class="wd"></div>`);
  const grid=$(`<div class="tiers wsel"></div>`);
  avail.forEach(t=>{
    const ok=a.balance>=t.cost;
    const el=$(`<div class="tier sgrid ${t.cost===WSEL?'sel':''} ${ok?'':'poor'}">
      ${t.cost===WSEL?'<div class="selck">✓</div>':''}
      <span class="dia blue tg"></span><div class="n">${t.mlbb}</div><div class="u">MLBB</div>
      <div class="c"><span class="dia gold" style="width:14px;height:14px"></span>${t.cost.toLocaleString()}</div></div>`);
    el.onclick=()=>{ WSEL=t.cost; render(); };
    grid.appendChild(el);
  });
  wrap.appendChild(grid);
  const btn=$(`<button class="wdbtn ${can?'go':'off'}">${a.earnBanned?'EARNING DISABLED':can?('WITHDRAW '+sel.mlbb+' MLBB DIAMONDS'):('COLLECT '+(sel.cost-a.balance).toLocaleString()+' MORE POINTS')}</button>`);

  else if(!a.earnBanned) btn.onclick=()=>toast('Collect '+(sel.cost-a.balance).toLocaleString()+' more points','bad');
  wrap.appendChild(btn);
  return wrap;
}

 26.5793 123.979 26.5045 123.295 26.3547C122.611 26.2115 122.136 26.0683 121.869 25.925C121.602 25.7753 121.469 25.7004 121.469 25.7004V22.0774Z" fill="white"></path></svg>`;
function render(){
  const s=STATE; if(!s) return;
  document.getElementById('loading').classList.add('hide');
  const app=document.getElementById('app'); app.classList.remove('hide'); app.innerHTML='';
  const a=s.account,c=s.config;

  // header (in HTML now)
  app.appendChild($(`<div class="head">
    <div class="brand"><div class="logo"><span class="dia gold" style="width:16px;height:16px"></span></div>
      <div><h1>Earn</h1><small>SANTORYU REWARDS</small></div></div>
    <div class="balpill"><span class="dia gold" style="width:15px;height:15px"></span><span class="v">${a.balance.toLocaleString()}</span></div>
  </div>`));

  // Device/earn gate warning — kapag naka-earnBanned ang account (neutralized clone/cheat, o
  // ibang account na ang may-ari ng device), agad na ipakita ang malinaw na babala sa taas.
  if(a.earnBanned) app.appendChild($(`<div class="banwarn">
    <div class="bwic">!</div>
    <div class="bwtx"><div class="bwt">Earning is not available on this device</div>
      <div class="bwd">This looks like a duplicate account or an emulator. Only one real device per person can earn. The rest of the app works normally.</div></div>
  </div>`));

  // profile card (sino ka — avatar, pangalan, invite code, total earned)
  const pfav = a.avatarUrl ? `<img class="pf-av" src="${esc(a.avatarUrl)}" alt="" onerror="this.removeAttribute('src');this.classList.add('pf-ini');this.textContent='${esc((a.name||'U').slice(0,1).toUpperCase())}'">`
    : `<div class="pf-av pf-ini">${esc((a.name||'U').slice(0,1).toUpperCase())}</div>`;
  app.appendChild($(`<div class="profile">
    ${pfav}
    <div class="pf-mid">
      <div class="pf-name">${esc(a.name||'Player')}${s.isAdmin?'<span class="pf-badge">ADMIN</span>':''}</div>
      <div class="pf-sub">Invite code · <b>${esc(s.code||'—')}</b></div>
    </div>
    <div class="pf-stat"><div class="pf-sv">${kFmt(a.earned||0)}</div><div class="pf-sl">TOTAL EARNED</div></div>
  </div>`));

  // hero (BLUE) — ang goal = PINILING tier (WSEL). Nagbabago kapag may pinili sa grid sa baba.
  const g=ensureSel(s)||goalTier(s),reached=a.balance>=g.cost,remaining=Math.max(0,g.cost-a.balance),frac=Math.min(100,Math.round(a.balance/g.cost*100));
  const hero=$(`<div class="hero">
    <div class="eyebrow">${g.firstOnly?'FIRST WITHDRAWAL REWARD':'YOUR WITHDRAWAL GOAL'}</div>
    <div class="reward"><div class="num">${g.mlbb}</div><div class="rlabel"><span class="a">MLBB</span><span class="b">DIAMONDS</span></div></div>
    <div class="sub">${g.firstOnly?'One-time starter — cash out straight to your account':'Pick a target below — save up for a bigger reward'}</div>
    <div class="emblem dia blue"></div>
    <div class="prog"><div class="prow"><div class="l">PROGRESS</div><div class="r">${a.balance.toLocaleString()} / ${g.cost.toLocaleString()}</div></div>
      <div class="track"><div class="fill" data-w="${frac}"></div></div></div>
    <div class="cta ${reached&&!a.earnBanned?'':'off'}" id="hcta"><span class="dia ${reached?'blue':''}" style="width:14px;height:14px;${reached?'':'display:none'}"></span><span>${a.earnBanned?'EARNING DISABLED':reached?'WITHDRAW NOW':'COLLECT '+remaining.toLocaleString()+' MORE'}</span></div>
  </div>`);
  if(reached&&!a.earnBanned) hero.querySelector('#hcta').onclick=()=>openWithdraw(g);
  app.appendChild(hero);

  // WITHDRAW — Codashop grid: piliin ang amount = goal mo na rin (makikita sa progress sa taas)
  app.appendChild($(`<div class="sh"><div class="t">WITHDRAW</div><div class="x blue">tap to set your goal</div></div>`));
  app.appendChild(withdrawPanel(s));

  // tournament banner (LIVE EVENT) — bukas ang buong page on tap
  app.appendChild($(`<div class="sh"><div class="t">LIVE EVENT</div></div>`));
  const tb=$(`<div class="tbanner" id="tbanner">
    <div class="lbl"><span class="live"></span> TIKTOK TOURNAMENT</div>
    <h3 id="tbTitle">TikTok Highlight Cup</h3>
    <div class="ppl">PRIZE POOL</div><div class="pp" id="tbPrize">—</div>
    <div class="go">JOIN ›</div></div>`);
  tb.onclick=openTournament;
  app.appendChild(tb);
  updateBanner();

  // Play & Earn (jogos) — highlighted hero. Lumalabas LANG kapag naka-enable sa config AT
  // sinusuportahan ng native bridge (iwas dead button sa lumang app build na walang playGames).
  // jogos Play & Earn — one-time per user (testing). PLAY NOW -> maglaro sa Chrome (may
  // floating timer) -> pagbalik, CLAIM. Itinatago kapag na-claim na. Double-gated + native.
  if(c.jogosEnabled && !s.jogosClaimed && (!isNative || (window.Android && (window.Android.playGames||window.Android.claimJogos)))){
    const peRew=c.jogosReward||25, peMin=Math.max(1,Math.round((c.jogosQualifySecs||120)/60));
    const gd='<span class="dia gold" style="width:14px;height:14px;vertical-align:-.16em"></span>';
    const clk='<svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-.16em" fill="none" stroke="#8FF3C6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 1.8"/></svg>';
    const claimable=!!s.jogosClaimable;
    const pe=$(`<div class="pehero" id="pehero">
      <div class="lbl"><span class="dot"></span> PLAY &amp; EARN</div>
      <h3>Play &amp; earn ${peRew} diamonds</h3>
      <div class="desc">${claimable?("You're all done — claim your "+peRew+" diamonds!"):('Play free games in Chrome for '+peMin+' minutes straight. Leave and it resets. Then claim your reward — free.')}</div>
      <div class="rwrow"><div class="rw">${clk} ${peMin} min</div><div class="rw hot">${gd} +${peRew}</div></div>
      <div class="go" id="pego">${claimable?('CLAIM '+peRew+' DIAMONDS'):'PLAY NOW ›'}</div>
      <div class="jby"><span class="cap">GAMES BY</span>${JOGOS_LOGO}</div>
    </div>`);
    pe.querySelector('#pego').onclick=async ev=>{
      ev.stopPropagation();
      if(claimable){
        if(isNative&&window.Android.claimJogos){
          const g=ev.currentTarget; g.textContent='…';
          const r=await call('claimJogos');
          if(r&&r.ok){ gainFx(peRew,'gold'); requestState(); }
          else { g.textContent='CLAIM '+peRew+' DIAMONDS'; toast("Can't claim yet — please try again."); }
        }
      } else if(isNative&&window.Android.playGames){ window.Android.playGames(); }
    };
    app.appendChild(pe);
  }

  // daily (GOLD points)
  const dAvail=s.dailyKnown&&s.dailyAvailable;
  app.appendChild($(`<div class="sh"><div class="t">DAILY BONUS</div></div>`));
  const dCard=$(`<div class="card"><div class="rowflex"><div class="di" style="background:rgba(45,212,167,.14)">${II('ic-daily')}</div>
    <div class="gleft"><div class="n">Daily check-in</div><div class="d" id="dd">${dAvail?('Claim +'+c.dailyBonus+' free points today'):(s.dailyKnown?'Come back tomorrow for more':'Come back daily for free points')}</div></div>
    <button class="act ${dAvail?'on':'off'}" id="db">${dAvail?'CLAIM':'CLAIMED'}</button></div></div>`);
  if(dAvail) dCard.querySelector('#db').onclick=async e=>{e.target.textContent='…'; const r=await call('claimDaily',c.dailyBonus); if(r.ok) gainFx(c.dailyBonus,'gold'); requestState();};
  else if(s.dailyKnown) startCountdown(dCard.querySelector('#dd'),s.dailyMs);
  app.appendChild(dCard);

  appendTasks(app,s);

  // mission (premium card)
  const done=Math.min(c.missionGoal,Math.max(0,a.referralCount-a.missionBaseline)),mReady=done>=c.missionGoal&&!a.earnBanned;
  app.appendChild($(`<div class="sh"><div class="t">REFERRAL MISSION</div></div>`));
  const mCard=$(`<div class="card mission">
    <div class="rowflex">
      <div class="di mission-ic">${II('ic-mission')}</div>
      <div class="gleft"><div class="n">Invite ${c.missionGoal} friends</div><div class="d">Reach the goal to claim a big bonus</div></div>
      <div class="mreward"><span class="dia gold" style="width:13px;height:13px"></span>+${c.missionBonus}</div>
    </div>
    <div class="track" style="margin-top:13px"><div class="fill" data-w="${Math.round(done/c.missionGoal*100)}"></div></div>
    <div class="mfoot"><span class="mprog">${done} / ${c.missionGoal} friends joined</span>
      <button class="act ${mReady?'on':'off'}" id="mb">${mReady?'CLAIM BONUS':'KEEP INVITING'}</button></div>
  </div>`);
  if(mReady) mCard.querySelector('#mb').onclick=async e=>{e.target.textContent='…'; const r=await call('claimMission',c.missionBonus,a.referralCount); if(r.ok) gainFx(c.missionBonus,'gold'); requestState();};
  app.appendChild(mCard);

  // invite (code + copy + share code + share link + apply code)
  app.appendChild($(`<div class="sh"><div class="t">INVITE FRIENDS</div><div class="x">+${c.perInvite} per friend</div></div>`));
  const link='https://santoryutoolkit.com/?ref='+encodeURIComponent(s.code);
  const iv=$(`<div class="card inv">
    <div class="row1"><div class="code">${esc(s.code)}</div><button class="icb copy" id="cpy">${II('ic-copy')}</button></div>
    <button class="sbtn code shareone" id="shc">${II('ic-share')}<span>Share my invite code</span></button>
    ${a.referred
      ? `<div class="appliedbox"><span class="ckc">✓</span><div class="apl"><div class="apt">FRIEND CODE APPLIED</div><div class="apc2">${esc(a.referredByCode||'—')}</div></div><span class="lock">🔒</span></div>`
      : `<div class="applywrap"><div class="applylbl">Got a friend's code? Apply it for a bonus.</div><div class="applybox"><input id="apc" placeholder="Enter a friend's code" maxlength="20"><button id="apb">APPLY</button></div></div>`}
  </div>`);
  iv.querySelector('#cpy').onclick=()=>{window.Android.copy(s.code); toast('Code copied!','good');};
  iv.querySelector('#shc').onclick=()=>window.Android.share('Join Santoryu Toolkit and get FREE MLBB diamonds! Use my code '+s.code+' — '+link);
  if(!a.referred){ const ab=iv.querySelector('#apb'); ab.onclick=async()=>{
    const v=iv.querySelector('#apc').value.trim().toUpperCase(); if(!v){toast('Enter a code','bad'); return;}
    ab.textContent='…'; const r=await call('applyReferral',v);
    if(r.ok) gainFx(c.inviteeBonus,'gold');
    else toast(refErr(r.error),'bad'); requestState();
  };}
  app.appendChild(iv);

  // history + invited → sariling pages (mas magaan ang main, mas mabilis)
  app.appendChild($(`<div class="sh"><div class="t">YOUR ACTIVITY</div></div>`));
  const navc=$(`<div class="card"></div>`);
  const r1=$(`<div class="navrow"><div class="di" style="width:38px;height:38px;background:rgba(95,160,255,.12)">${II('ic-history')}</div><div class="gl"><div class="n">Withdrawal history</div><div class="s">${(s.history||[]).length} total</div></div><div class="ch">›</div></div>`);
  r1.onclick=openHistory;
  const r2=$(`<div class="navrow"><div class="di" style="width:38px;height:38px;background:rgba(45,212,167,.12)">${II('ic-friends')}</div><div class="gl"><div class="n">Friends you invited</div><div class="s">${(s.invited||[]).length} joined</div></div><div class="ch">›</div></div>`);
  r2.onclick=openInvited;
  navc.appendChild(r1); navc.appendChild(r2);
  app.appendChild(navc);

  // legal footer (Terms / Privacy / Delete account)
  const ft=$(`<div class="legal">
    <button class="lgl" id="lglTerms">Terms of Use</button><span class="lgd">·</span>

const MLBB_CHECK_URL='https://asia-southeast1-diamond-bang-92125.cloudfunctions.net/mlbbCheck';
function mlbbVerify(id,server){ return fetch(MLBB_CHECK_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,zone:server})}).then(r=>r.json()).catch(()=>({ok:false,error:'network'})); }
// I-wire ang dalawang input (id + server) sa isang output element. Auto-check (debounced)
// kapag valid ang format. Itinatago ang verified nick sa outEl.dataset.ign.
function wireMlbb(idEl,srvEl,outEl){
  let t=null,last='';
  const run=()=>{
    const id=(idEl.value||'').trim(),srv=(srvEl.value||'').trim();
    outEl.dataset.ign='';
    if(!/^\d{5,12}$/.test(id)||!/^\d{1,6}$/.test(srv)){ outEl.innerHTML=''; last=''; return; }
    const key=id+'_'+srv; if(key===last) return; last=key;
    outEl.innerHTML='<span style="color:var(--txt2);font-size:13px">Checking account…</span>';
    mlbbVerify(id,srv).then(r=>{
      if((idEl.value.trim()+'_'+srvEl.value.trim())!==key) return; // stale
      if(r&&r.ok&&r.nick){ outEl.dataset.ign=r.nick;
        outEl.innerHTML='<span style="display:inline-flex;align-items:center;gap:6px;color:#34d399;font-weight:700;font-size:13.5px"><span style="font-weight:900">✓</span>'+esc(r.nick)+'</span>'; }
      else { outEl.innerHTML='<span style="color:#f2a33c;font-size:13px">Account not found — i-check ang Game ID at Server</span>'; }
    });
  };
  const deb=()=>{ if(t)clearTimeout(t); t=setTimeout(run,500); };
  idEl.addEventListener('input',deb); srvEl.addEventListener('input',deb);
}

//=== withdrawal congratulations (excited na dialog kapag na-fulfill na) ============
// Sinusubaybayan ang history: kapag may withdrawal na naging "fulfilled" na hindi pa
// ni-celebrate, magpakita ng masiglang congrats + invite CTA. Sa UNANG load, tahimik na
// sini-seed ang lahat ng existing fulfilled (walang spam) — bagong fulfilled lang ang mag-t-trigger.
function maybeCongrats(s){
  try{
    const fulfilled=(s.history||[]).filter(h=>h && h.status==='fulfilled' && h.ts);
    if(!fulfilled.length) return;
    const KEY='santoryu_celebrated_ts';
    let seen; try{ seen=JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){ seen=null; }
    if(seen===null || !Array.isArray(seen)){
      localStorage.setItem(KEY, JSON.stringify(fulfilled.map(h=>h.ts)));
      return;
    }
    const seenSet=new Set(seen);
    // pinakabagong fulfilled na hindi pa ni-celebrate
    const fresh=fulfilled.slice().sort((a,b)=>(b.ts||0)-(a.ts||0)).find(h=>!seenSet.has(h.ts));
    if(!fresh) return;
    seen.push(fresh.ts); localStorage.setItem(KEY, JSON.stringify(seen));
    showCongrats(fresh);
  }catch(e){}
}
function showCongrats(w){
  if(document.querySelector('.ov.congrats')) return;
  const code=(STATE&&STATE.code)||'';

  const ov=$(`<div class="ov congrats"><div class="modal cg">

    <div class="cgmedal"><span class="dia blue" style="width:34px;height:34px"></span></div>
    <div class="cgkick">WITHDRAWAL SENT</div>
    <div class="cgh">CONGRATULATIONS!</div>
    <div class="cgamt">${amt} <span>MLBB DIAMONDS</span></div>
    <div class="cgmsg">delivered to your Mobile Legends account. Keep inviting friends and cash out even more!</div>

}

//=== review modal (require a written comment so it's not bot-like) =================
function openReview(t){
  const ov=$(`<div class="ov"><div class="modal">
    <h3>Rate us & write a review</h3>
    <p>Open Google Play, give us 5 stars, and write an honest comment about what you like. Paste your review below to confirm.</p>
    <label>YOUR REVIEW (min 15 chars)</label><textarea id="rv" rows="3" placeholder="Share what you love about the app…"></textarea>
    <div class="err" id="re"></div>
    <div class="mrow"><button class="btn ghost" id="ropen">Open Play</button><button class="btn go" id="rok" disabled>Claim +${t.reward}</button></div></div></div>`);
  document.body.appendChild(ov);
  const ta=ov.querySelector('#rv'),ok=ov.querySelector('#rok');
  ta.oninput=()=>{ ok.disabled = ta.value.trim().length<15; };
  ov.querySelector('#ropen').onclick=()=>window.Android.openLink(t.link);
  ok.onclick=async()=>{
    if(ta.value.trim().length<15){ov.querySelector('#re').textContent='Write at least 15 characters'; return;}
    ok.textContent='…'; ok.disabled=true;
    const r=await call('claimTask',t.id,t.reward);
    if(r.ok){ ov.remove(); gainFx(t.reward,'gold'); toast('Thanks for the review! +'+t.reward,'good'); }
    else{ ov.remove(); toast('Could not verify — try again','bad'); }
    requestState();
  };
}

//=== daily countdown ==============================================================
let cdT=null;
function startCountdown(el,ms){
  if(cdT) clearInterval(cdT);
  function tick(){ if(ms<=0){el.textContent='Available now — reopen to claim'; clearInterval(cdT); return;}
    const h=Math.floor(ms/3600000),m=Math.floor(ms%3600000/60000),s=Math.floor(ms%60000/1000);
    el.textContent='Next bonus in '+String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); ms-=1000; }
  tick(); cdT=setInterval(tick,1000);
}

//=== floating withdraw proof (LIVE fulfilled payouts — admin-controlled, walang hardcode) ===
const PAYOUTS_URL='https://asia-southeast1-diamond-bang-92125.cloudfunctions.net/earnPayouts';
let PAYOUTS=[], ppI=0, ppTimer=null;
function pAgo(ts){ const d=Date.now()-(ts||0); const m=Math.floor(d/60000);
  if(m<2) return 'just now'; if(m<60) return m+'m ago';
  const h=Math.floor(m/60); if(h<24) return h+'h ago'; return Math.floor(h/24)+'d ago'; }
function startPayoutPops(){
  const el=document.getElementById('payoutpop'); if(!el||!PAYOUTS.length) return;
  if(ppTimer) clearInterval(ppTimer);
  function show(){
    const p=PAYOUTS[ppI%PAYOUTS.length]; ppI++;
    const av=p.avatarUrl?`<img class="pa" src="${esc(p.avatarUrl)}" onerror="this.removeAttribute('src')">`:`<div class="pa"></div>`;
    el.innerHTML=`${av}<div class="pt"><b>${esc(p.name)}</b> just withdrew <span class="amt">${p.mlbb}</span><span class="dia blue" style="width:12px;height:12px"></span><span class="lbl">MLBB Diamonds · ${pAgo(p.ts)}</span></div>`;
    el.classList.add('show'); setTimeout(()=>el.classList.remove('show'), 4300);
  }
  setTimeout(show, 2000); ppTimer=setInterval(show, 8500);
}
function fetchPayouts(){
  fetch(PAYOUTS_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'})
    .then(r=>r.json()).then(j=>{ if(j&&Array.isArray(j.payouts)&&j.payouts.length){ PAYOUTS=j.payouts; startPayoutPops(); } })
    .catch(()=>{ if(!isNative){ PAYOUTS=[{name:'joharto Ambulodto',mlbb:22,avatarUrl:'',ts:Date.now()-3600000},{name:'eyy',mlbb:22,avatarUrl:'',ts:Date.now()-7200000}]; startPayoutPops(); } });
}
setTimeout(fetchPayouts, 600);
