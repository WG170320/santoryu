function tongitsHero(app,s){
  if(!tongitsEligible(s)) return;
  const c=s.campaign, cs=s.campaignState||{};
  const p=tongitsProgress(c,cs);
  const total=tongitsTotalReward(c);
  let status;
  if(!p.installed) status='Step 1 of 6 · Install '+esc(c.title||'Tongits Go')+' to begin';
  else if(p.reg==='pending') status='Step 2 of 6 · Registration is pending review';
  else if(p.reg==='rejected') status='Step 2 of 6 · Registration was declined — tap to re-upload';
  else if(!p.regApproved) status='Step 2 of 6 · Upload your registration screenshot';
  else if(p.claimedToday) status='Day '+p.nextDay+' of '+p.daysTotal+' unlocks tomorrow';
  else status='Day '+p.nextDay+' of '+p.daysTotal+' · play & claim now';
  const started=p.installed||p.reg!=='none';
  const cta=started?'CONTINUE MISSION':'START MISSION';
  // 6-step ladder: install + register + each day. Filled = completed steps.
  const totalSteps=2+(p.daysTotal||0);
  const doneSteps=(p.installed?1:0)+(p.regApproved?1:0)+Math.min(p.streak||0, p.daysTotal||0);
  let segs='';
  for(let k=0;k<totalSteps;k++){ const cl=k<doneSteps?'on':((k===doneSteps&&!p.done)?'cur':''); segs+='<div class="tgh-seg '+cl+'"></div>'; }
  const stepTxt=p.done?'All steps complete':('Step <b>'+Math.min(doneSteps+1,totalSteps)+'</b> of '+totalSteps);
  const card=$(`<div class="tgh"><div class="tgh-in">
    <div class="tgh-top"><div class="tgh-eyebrow"><i></i>HIGH-VALUE MISSION</div>
      <div class="tgh-reward"><span class="dia gold" style="width:15px;height:15px"></span>+${total}</div></div>
    <h3 class="tgh-title">${esc(c.title||'Tongits Go')}</h3>
    <div class="tgh-sub">${status}</div>
    <div class="tgh-track">${segs}</div>
    <div class="tgh-steplbl"><span>${stepTxt}</span><span>${doneSteps}/${totalSteps} done</span></div>
    <button class="tgh-claim">${cta} &rsaquo;</button>
  </div></div>`);
  card.querySelector('.tgh-claim').onclick=()=>openTongitsPage(s);
  app.appendChild(card);
}
function openTongitsPage(s){
  const c=s.campaign;
  openPage(c.title||'Tongits Go', function(body){ body.className='tgpage'; body.id='tgpagebody'; TG_START=0; renderTongitsPage(body); });
  TG_ACCESS=undefined; tongitsCheckAccess();
  // Re-check when the user returns from the Usage-access settings screen → unlock Day play.
  if(!TG_VISBOUND){ TG_VISBOUND=true; document.addEventListener('visibilitychange', function(){
    if(document.hidden) return; if(document.getElementById('tgpagebody')) tongitsCheckAccess();
  }); }
}
function tongitsStepRow(n,title,rewardTxt,desc,cls,actionsHtml){
  return '<div class="tgp-step '+cls+'"><div class="tgp-row"><span class="tgp-dot">'+(cls==='done'?'&#10003;':n)+'</span>'+
    '<div class="tgp-txt"><div class="tgp-t"><span>'+esc(title)+'</span><span class="tgp-rw">'+rewardTxt+'</span></div>'+
    '<div class="tgp-d">'+desc+'</div>'+(actionsHtml||'')+'</div></div></div>';
}
function renderTongitsPage(body){
  if(!body || typeof STATE==='undefined' || !STATE || !STATE.campaign) return;
  const c=STATE.campaign, cs=STATE.campaignState||{};
  const p=tongitsProgress(c,cs);
  const install=c.install||{reward:0}, register=c.register||{reward:0}, days=Array.isArray(c.days)?c.days:[];

  // Step 1 — Install
  let s1cls='', s1desc='', s1actions='';
  if(p.installed){ s1cls='done'; s1desc='Installed and verified.'; }
  else{
    s1desc='First, tap <b style="color:var(--gold-hi)">Download here</b> to get '+esc(c.title||'Tongits Go')+'. Install it, then confirm below.';
    s1actions='<div class="tgp-dlcta">'+
      '<button class="tgbtn dl" data-tg="open"><span class="dlic">&#11015;</span> DOWNLOAD HERE</button>'+
      '<div class="tgp-dlhint">Tap above to open '+esc(c.title||'Tongits Go')+' &mdash; you must download through this link to earn.</div>'+
      '<button class="tgbtn confirm" data-tg="installclaim">I\'ve already installed it &#8250;</button></div>';
  }
  let html=tongitsStepRow(1,'Install the app','+'+(install.reward||0), s1desc, s1cls, s1actions);

  // Step 2 — Register
  let s2cls=p.installed?'':'locked', s2desc='', s2actions='';
  if(p.regApproved){ s2cls='done'; s2desc='Registration verified.'; }
  else if(!p.installed){ s2desc='Unlocks after Step 1.'; }
  else if(p.reg==='pending'){ s2desc='We\'re reviewing your screenshot.'; s2actions='<div class="tgp-pending">&#9679; Pending review</div>'; }
  else if(p.reg==='rejected'){ s2desc='Please try again.'; s2actions='<div class="tgp-reject">'+esc(cs.register&&cs.register.reason||'Screenshot could not be verified.')+'</div>'+
      '<div class="tgp-actions"><button class="tgbtn" data-tg="upload">Re-upload screenshot</button></div>'; }
  else{ s2desc='Upload a screenshot of your Tongits Go account/registration.'; s2actions='<div class="tgp-actions"><button class="tgbtn" data-tg="upload">Upload screenshot</button></div>'; }
  html+=tongitsStepRow(2,'Register your account','+'+(register.reward||0), s2desc, s2cls, s2actions);

  // Usage Access is required before Day play (the play timer + claim both read real
  // UsageStats). On the ACTIVE day we show an "Allow usage access to start" button FIRST;
  // only after it's granted do the two buttons (Play 3 min + Claim) unlock.
  const gate = p.regApproved && TG_ACCESS!==true;

  // Steps 3-6 — Day 1..N
  for(let i=1;i<=p.daysTotal;i++){
    const dReward=(days[i-1]&&days[i-1].reward)||0;
    const claimedTs=p.daysClaimed[String(i)];
    let cls='locked', desc='', actions='';
    if(claimedTs){ cls='done'; desc='Claimed '+ago(claimedTs)+'.'; }
    else if(!p.regApproved){ desc='Unlocks after registration is approved.'; }
    else if(i<p.nextDay){ desc='Locked.'; }
    else if(i===p.nextDay && p.claimedToday){ desc='Come back tomorrow for Day '+p.nextDay+'.'; }
    else if(i===p.nextDay && gate){ cls=''; // active day, but Usage access not on yet
      const checking = TG_ACCESS===undefined;
      desc='First, allow Usage access &mdash; ito ang bumibilang ng totoong laro mo para gumana ang timer at claim.';
      actions='<div class="tgp-gnote"><span class="gt-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/></svg></span>'+
        '<span>Step 1: turn on Usage access to unlock Play &amp; Claim.</span></div>'+
        '<div class="tgp-actions"><button class="tgbtn '+(checking?'':'dl')+'" data-tg="grantaccess" '+(checking?'disabled':'')+'>'+(checking?'Checking&hellip;':'Allow usage access to start')+'</button>'+
        '<button class="tgbtn ghost" disabled>Play 3 min</button>'+
        '<button class="tgbtn" disabled>Claim +'+dReward+'</button></div>';
    }
    else if(i===p.nextDay){ cls=''; desc='Play '+esc(c.title||'Tongits Go')+' for at least 3 minutes, then claim.';
      actions='<div class="tgp-actions"><button class="tgbtn ghost" data-tg="play" data-reward="'+dReward+'">Play 3 min</button>'+
        '<button class="tgbtn" data-tg="dayclaim" data-day="'+i+'" data-reward="'+dReward+'" '+(TG_START?'':'disabled')+'>Claim +'+dReward+'</button></div>'; }
    else if(gate){ desc='Allow Usage access on Day '+p.nextDay+' first.'; }
    else{ desc='Unlocks after Day '+(i-1)+'.'; }
    html+=tongitsStepRow(2+i,'Day '+i+' — play & claim','+'+dReward, desc, cls, actions);
  }

  // Hero progress: diamonds collected so far vs total (motivational fill bar).
  const totalSteps=2+p.daysTotal;
  const doneSteps=(p.installed?1:0)+(p.regApproved?1:0)+Math.min(p.streak||0,p.daysTotal);
  const totalR=tongitsTotalReward(c);
  let collected=(p.installed?(+install.reward||0):0)+(p.regApproved?(+register.reward||0):0);
  for(let i=1;i<=Math.min(p.streak||0,p.daysTotal);i++){ collected+=(+((days[i-1]||{}).reward)||0); }
  const pct=totalR>0?Math.min(100,Math.round(collected/totalR*100)):0;
  body.innerHTML=
    '<div class="tgp-hero">'+
      '<div class="tgp-top"><div class="tgp-eyebrow">HIGH-VALUE MISSION</div>'+
        '<div class="tgp-badge">'+doneSteps+' / '+totalSteps+' STEPS</div></div>'+
      '<div class="tgp-title">'+esc(c.title||'Tongits Go')+'</div>'+
      '<div class="tgp-reward"><span class="dia gold" style="width:22px;height:22px"></span>+'+totalR+'<span class="tgp-rlbl">total reward</span></div>'+
      '<div class="tgp-note">'+esc(c.subtitle||'Complete every step for the full reward. We verify install, registration, and real play — no shortcuts.')+'</div>'+
      '<div class="tgp-prog"><div class="tgp-progbar"><div class="tgp-progfill" style="width:'+pct+'%"></div></div>'+
        '<div class="tgp-proglbl"><span>Collected <b>+'+collected+'</b> of '+totalR+'</span><span>'+pct+'%</span></div></div>'+
    '</div>'+
    '<div class="tgp-steps">'+html+'</div>';
  body.querySelectorAll('[data-tg]').forEach(b=>{ b.onclick=()=>tongitsAct(b.getAttribute('data-tg'), b); });
}
// Native bridge call with a hard timeout so a dropped picker/process-death never hangs the UI.
function callTimeout(m,ms,...a){
  return new Promise(resolve=>{
    const id='r'+(++REQ); let done=false;
    const timer=setTimeout(()=>{ if(done) return; done=true; delete pending[id]; resolve({ok:false,error:'timeout'}); }, ms);
    pending[id]=r=>{ if(done) return; done=true; clearTimeout(timer); resolve(r); };
    try{ window.Android[m](id,...a); }
    catch(e){ if(done) return; done=true; clearTimeout(timer); delete pending[id]; resolve({ok:false,error:'bridge_error'}); }
  });
}
async function tongitsAct(kind,btn){
  const c=STATE&&STATE.campaign; if(!c) return;
  if(kind==='open'){ if(window.Android&&window.Android.openTongitsLink) window.Android.openTongitsLink(); return; }
  if(kind==='grantaccess'){ if(window.Android&&window.Android.openUsageSettings) window.Android.openUsageSettings(); return; }
  if(kind==='play'){ const rw=+(btn&&btn.getAttribute('data-reward'))||0;
    // The floating play timer counts down from REAL Tongits Go foreground usage (UsageStats).
    // Without Usage Access that reads 0 forever → the timer looks frozen AND the claim fails.
    // Gate on it first (same permission the claim needs) so we never start a dead timer.
    if(window.Android&&window.Android.usageSeconds){
      try{ const u=await call('usageSeconds', (c&&c.package)||'', '0');
        if(u && u.hasAccess===false){
          toast('Turn on Usage access so the timer can count your play','bad');
          if(window.Android.openUsageSettings) window.Android.openUsageSettings();
          return;
        }
      }catch(e){}
    }
    TG_START=Date.now();
    // tongitsStartPlay: buksan ang laro + floating overlay timer (bumibilang lang habang Tongits
    // Go ang naka-foreground). Fallback sa openTongitsLink kung lumang app (walang bridge method).
    if(window.Android&&window.Android.tongitsStartPlay) window.Android.tongitsStartPlay(rw, String(TG_START));
    else if(window.Android&&window.Android.openTongitsLink) window.Android.openTongitsLink();
    renderTongitsPage(document.getElementById('tgpagebody')); return; }
  if(kind==='installclaim'){
    if(btn){ btn.textContent='…'; btn.disabled=true; }
    let r; try{ r=await call('tongitsClaimInstall'); }catch(e){ r=null; }
    if(r&&r.ok){ gainFx(r.reward||(c.install&&c.install.reward)||0,'gold'); toast('Install verified!','good'); requestState(); }
    else{ toast('Could not verify install — try again','bad'); renderTongitsPage(document.getElementById('tgpagebody')); }
    return;
  }
  if(kind==='upload'){
    if(btn){ btn.textContent='Uploading…'; btn.disabled=true; }
    let r; try{ r=await callTimeout('tongitsSubmitShot', 90000); }catch(e){ r=null; }
    if(r&&r.ok){ toast('Screenshot submitted — pending review','good'); requestState(); }
    else{
      const err=r&&r.error;
      if(err==='timeout') toast('Upload timed out — try again','bad');
      else if(err!=='cancelled') toast('Could not upload — try again','bad');
      renderTongitsPage(document.getElementById('tgpagebody'));
    }
    return;
  }
  if(kind==='dayclaim'){
    if(!TG_START){ toast('Play at least 3 minutes first','bad'); return; }
    if(btn){ btn.textContent='…'; btn.disabled=true; }
    let r; try{ r=await call('tongitsClaimDay', String(TG_START)); }catch(e){ r=null; }
    if(r&&r.ok){ TG_START=0; gainFx(r.reward||+btn.getAttribute('data-reward')||0,'gold'); toast('Day '+(r.day||'')+' claimed!','good'); requestState(); }
    else{
      const err=r&&r.error;
      if(err==='usage_required') toast('Play at least 3 minutes first','bad');
      else if(err==='claimed_today') toast('Already claimed today','bad');
      else if(err==='register_required') toast('Approve registration first','bad');
      else if(err==='already_done') toast('Mission already complete','bad');
      else if(err==='no_usage_access') toast('Enable usage access to verify play time','bad');
      else toast('Could not verify — try again','bad');
      renderTongitsPage(document.getElementById('tgpagebody'));
    }
    return;
  }
}

//=== daily countdown ==============================================================
let cdT=null;
function startCountdown(el,ms){
  if(cdT) clearInterval(cdT);
  function tick(){ if(ms<=0){el.textContent='Available now — reopen to claim'; clearInterval(cdT); return;}
    const h=Math.floor(ms/3600000),m=Math.floor(ms%3600000/60000),s=Math.floor(ms%60000/1000);
    el.textContent='Next bonus in '+String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); ms-=1000; }
  tick(); cdT=setInterval(tick,1000);
}
