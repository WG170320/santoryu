<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Santoryu — Earn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Rajdhani:wght@500;600;700&family=Teko:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#E8B44A; --gold-hi:#FFE08A; --gold-deep:#A9781F;
    --blue:#4DA6FF; --blue-hi:#9BD4FF; --blue-deep:#1E63B0; --cyan:#5FE6FF;
    --emerald:#2DD4A7;
    --bg:#07090C; --surf:#11151B; --surf2:#161B22; --line:#222a34;
    --txt:#EDF1F5; --txt2:#8A95A3; --danger:#FF5E6C; --amber:#F5B445; --green:#34D399;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;}
  html,body{background:var(--bg);}
  body{font-family:'Inter',sans-serif; color:var(--txt); padding:14px 14px 34px; max-width:440px; margin:0 auto;
    background:radial-gradient(120% 36% at 50% -4%, rgba(77,166,255,.06), transparent 60%), var(--bg);}
  .hide{display:none !important;}

  /* diamonds = REAL provided asset (diamond.webp). BLUE = MLBB (withdraw), GOLD = points (tinted) */
  .dia{display:inline-block; vertical-align:middle; background-position:center; background-repeat:no-repeat; background-size:contain;}
  .dia.blue{background-image:url('gem-blue.png');}
  .dia.gold{background-image:url('gem-gold.png');}

  /* header (now in HTML) */
  .head{display:flex; align-items:center; justify-content:space-between; padding:4px 2px 0; margin-bottom:15px;}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .logo{width:34px;height:34px;border-radius:10px; display:flex;align-items:center;justify-content:center;
    background:linear-gradient(150deg,#1c2128,#0c0f14); border:1px solid rgba(232,180,74,.4); box-shadow:0 4px 14px -4px rgba(232,180,74,.4);}
  .brand h1{font-family:'Chakra Petch'; font-weight:700; font-size:21px; letter-spacing:.5px; line-height:1;}
  .brand small{display:block; font-family:'Rajdhani'; font-weight:600; font-size:10px; letter-spacing:3px; color:var(--txt2); margin-top:2px;}
  .balpill{display:flex; align-items:center; gap:8px; background:linear-gradient(180deg,rgba(232,180,74,.14),rgba(232,180,74,.05));
    border:1px solid rgba(232,180,74,.4); padding:8px 14px; border-radius:30px; box-shadow:0 4px 14px -6px rgba(232,180,74,.5); transition:transform .2s;}
  .balpill.bump{animation:bump .5s ease;}
  @keyframes bump{0%,100%{transform:scale(1);}35%{transform:scale(1.16);}}
  .balpill .v{font-family:'Rajdhani'; font-weight:700; font-size:18px; color:var(--gold-hi);}

  /* HERO (BLUE = MLBB diamonds) */
  .hero{position:relative; border-radius:22px; overflow:hidden; padding:18px;
    background:linear-gradient(100deg, rgba(8,11,16,.94) 26%, rgba(8,11,16,.55) 58%, rgba(8,11,16,.25) 100%), url('hero-with.jpg') center/cover #080b10;
    border:1px solid rgba(77,166,255,.40); box-shadow:0 14px 40px -14px rgba(77,166,255,.34), inset 0 1px 0 rgba(255,255,255,.08);}
  .eyebrow{font-family:'Chakra Petch'; font-weight:700; font-size:10.5px; letter-spacing:3px; color:var(--cyan); text-shadow:0 0 12px rgba(95,230,255,.5);}
  .reward{display:flex; align-items:center; gap:10px; margin-top:2px;}
  .num{font-family:'Teko'; font-weight:700; font-size:72px; line-height:.8; color:var(--blue-hi); text-shadow:0 2px 16px rgba(77,166,255,.45);}
  .rlabel{font-family:'Rajdhani'; line-height:1.05;}
  .rlabel .a{font-weight:700; font-size:23px; letter-spacing:1px; display:block;}
  .rlabel .b{font-weight:600; font-size:14px; letter-spacing:4.5px; color:var(--txt2); display:block; margin-top:1px;}
  .sub{font-size:11px; color:var(--txt2); margin-top:10px; font-weight:500; max-width:185px; line-height:1.4;}
  .emblem{display:none;}
  @keyframes floaty{0%,100%{transform:translateY(-44%);}50%{transform:translateY(-37%);}}
  .prog{margin-top:14px;}
  .prow{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:6px;}
  .prow .l{font-family:'Chakra Petch'; font-weight:600; font-size:9.5px; letter-spacing:3px; color:var(--txt2);}
  .prow .r{font-family:'Rajdhani'; font-weight:700; font-size:14px; color:var(--cyan);}
  .track{height:10px; border-radius:6px; background:rgba(255,255,255,.07); box-shadow:inset 0 1px 2px rgba(0,0,0,.5); overflow:hidden;}
  .fill{height:100%; border-radius:6px; background:linear-gradient(90deg,var(--emerald),var(--cyan)); box-shadow:0 0 10px rgba(95,230,255,.6); width:0; transition:width 1s cubic-bezier(.2,.8,.2,1);}
  .cta{margin-top:15px; height:46px; border-radius:13px; border:1px solid rgba(155,212,255,.6); display:flex; align-items:center; justify-content:center; gap:9px; cursor:pointer;
    background:linear-gradient(180deg,var(--blue-hi),var(--blue) 45%,var(--blue-deep)); box-shadow:0 7px 18px -4px rgba(77,166,255,.5), inset 0 1px 0 rgba(255,255,255,.5);}
  .cta:active{transform:scale(.98);}
  .cta.off{background:var(--surf2); border-color:var(--line); box-shadow:none; cursor:default;}
  .cta span{font-family:'Chakra Petch'; font-weight:700; font-size:14px; letter-spacing:3px; color:#04121f;}
  .cta.off span{color:var(--txt2); letter-spacing:1px;}

  .sh{display:block; margin:22px 2px 11px; overflow:hidden;}
  .sh .t{font-family:'Chakra Petch'; font-weight:700; font-size:12px; letter-spacing:2px; color:var(--txt2); float:left;}
  .sh .x{font-size:11px; color:var(--gold); font-weight:600; float:right;}
  .sh .x.blue{color:var(--cyan);}

  .tiers{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
  .tier{background:var(--surf); border:1px solid var(--line); border-radius:13px; padding:11px 4px 9px; text-align:center; cursor:pointer; transition:transform .12s,border-color .2s;}
  .tier:active{transform:scale(.95);}
  .tier.lock{border-color:rgba(77,166,255,.5); background:linear-gradient(180deg,rgba(77,166,255,.10),var(--surf));}
  .tier.used{opacity:.4; cursor:default;}
  .tier .tg{width:24px;height:24px;margin:0 auto 6px;}
  .tier .n{font-family:'Teko'; font-weight:600; font-size:23px; line-height:.8;}
  .tier .u{font-size:8px; letter-spacing:1px; color:var(--txt2); margin-top:2px;}
  .tier .c{margin-top:7px; font-family:'Rajdhani'; font-weight:700; font-size:12px; color:var(--gold); border-top:1px solid var(--line); padding-top:6px; display:flex; align-items:center; justify-content:center; gap:4px;}
  /* withdraw — Codashop-style selectable grid + single button */
  .wd{margin-bottom:4px;}
  .tiers.wsel{grid-template-columns:repeat(3,1fr);}
  .tier.sgrid{position:relative; cursor:pointer; padding:13px 4px 11px;}
  .tier.sgrid.sel{border-color:#4DA6FF; background:linear-gradient(180deg,rgba(77,166,255,.14),var(--surf)); box-shadow:0 0 0 1.5px rgba(77,166,255,.55), 0 8px 20px rgba(77,166,255,.18);}
  .tier.sgrid.poor{opacity:.45;}
  .tier .selck{position:absolute; top:6px; right:7px; width:17px; height:17px; border-radius:50%; background:#4DA6FF; color:#06223f; font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center;}
  .wdbtn{width:100%; margin-top:13px; border:none; border-radius:14px; padding:16px; font-family:'Chakra Petch'; font-weight:700; font-size:13.5px; letter-spacing:.8px; cursor:pointer;}
  .wdbtn.go{background:linear-gradient(180deg,#3BE0B6,#1FB892); color:#06231b; box-shadow:0 8px 22px rgba(45,212,167,.32);}
  .wdbtn.go:active{transform:translateY(1px);}
  .wdbtn.off{background:rgba(255,255,255,.05); color:var(--txt2); cursor:default;}

  .card{background:var(--surf); border:1px solid var(--line); border-radius:15px; padding:14px;}
  .rowflex{display:flex; align-items:center; gap:12px;}
  .di{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto; overflow:hidden;}
  .di svg{width:21px;height:21px;}
  .di img{width:100%;height:100%;object-fit:cover;}
  .icimg{width:28px;height:28px;object-fit:contain;display:block;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4));}
  .gleft{flex:1; min-width:0;}
  .gleft .n{font-family:'Rajdhani'; font-weight:700; font-size:16px; line-height:1.15;}
  .gleft .d{font-size:11px; color:var(--txt2); margin-top:1px;}
  .act{font-family:'Rajdhani'; font-weight:700; font-size:13px; letter-spacing:.5px; padding:9px 16px; border-radius:10px; cursor:pointer; white-space:nowrap; border:none; transition:transform .12s;}
  .act:active{transform:scale(.94);}
  .act.on{background:linear-gradient(90deg,var(--emerald),var(--gold)); color:#04140f;}
  .act.off{background:var(--surf2); color:var(--txt2); cursor:default;}

  /* invite: code + copy + share + share link + apply code */
  .inv .row1{display:flex; align-items:center; gap:8px;}
  .code{flex:1; font-family:'Chakra Petch'; font-weight:700; font-size:15px; letter-spacing:1px; color:var(--emerald); background:#0d1117; border:1px dashed rgba(45,212,167,.4); border-radius:9px; padding:10px 12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .icb{width:42px;height:42px;flex:0 0 auto;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;transition:transform .12s;}
  .icb:active{transform:scale(.9);}
  .icb svg{width:19px;height:19px;}
  .icb.copy{background:rgba(232,180,74,.14); border:1px solid rgba(232,180,74,.4);}
  .icb.copy svg{stroke:var(--gold);}
  .share2{display:flex; gap:8px; margin-top:9px;}
  .sbtn{flex:1; display:flex; align-items:center; justify-content:center; gap:7px; font-family:'Rajdhani'; font-weight:700; font-size:13px; letter-spacing:.5px; padding:11px; border-radius:10px; border:none; cursor:pointer; transition:transform .12s;}
  .sbtn:active{transform:scale(.96);}
  .sbtn.code{background:linear-gradient(180deg,var(--emerald),#1aa583); color:#04140f;}
  .sbtn.link{background:rgba(95,230,255,.12); border:1px solid rgba(95,230,255,.35); color:var(--cyan);}
  .sbtn svg{width:15px;height:15px;}
  .applywrap{margin-top:11px; padding-top:12px; border-top:1px solid var(--line);}
  .applylbl{font-size:11px; color:var(--txt2); margin-bottom:8px;}
  .applybox{display:flex; gap:8px;}
  .appliedbox{display:flex; align-items:center; gap:11px; margin-top:11px; padding-top:12px; border-top:1px solid var(--line);}
  .appliedbox .ckc{width:25px;height:25px;border-radius:50%;background:var(--emerald);color:#04140f;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:0 0 auto;}
  .appliedbox .apl{flex:1;min-width:0;}
  .appliedbox .apt{font-size:10px;letter-spacing:1.5px;color:var(--emerald);font-weight:700;font-family:'Chakra Petch';}
  .appliedbox .apc2{font-family:'Chakra Petch';font-weight:700;font-size:15px;letter-spacing:1px;color:var(--txt);margin-top:2px;}
  .appliedbox .lock{font-size:14px;opacity:.5;flex:0 0 auto;}
  .applybox input{flex:1; background:#0d1117; border:1px solid var(--line); border-radius:9px; padding:10px 12px; color:var(--txt); font-size:13px; font-family:'Chakra Petch'; letter-spacing:1px; text-transform:uppercase;}
  .applybox input:focus{outline:none; border-color:var(--emerald);}
  .applybox button{background:rgba(45,212,167,.15); border:1px solid rgba(45,212,167,.4); color:var(--emerald); font-family:'Rajdhani'; font-weight:700; padding:0 16px; border-radius:9px; cursor:pointer;}

  /* lists: history + invited */
  .litem{display:flex; align-items:center; gap:11px; padding:11px 2px; border-bottom:1px solid rgba(34,42,52,.6);}
  .litem:last-child{border-bottom:none;}
  .litem .nm{flex:1; font-family:'Rajdhani'; font-weight:600; font-size:14px;}
  .litem .sm{font-size:11px; color:var(--txt2);}
  .stat{font-family:'Rajdhani'; font-weight:700; font-size:11px; letter-spacing:1px; padding:4px 9px; border-radius:7px;}
  .stat.pending{background:rgba(245,180,69,.14); color:var(--amber);}
  .stat.fulfilled{background:rgba(52,211,153,.14); color:var(--green);}
  .stat.rejected{background:rgba(255,94,108,.14); color:var(--danger);}
  .empty{text-align:center; color:var(--txt2); font-size:12px; padding:16px 0;}

  /* nav rows (open sub-pages) */
  .navrow{display:flex; align-items:center; gap:12px; padding:13px 2px; cursor:pointer;}
  .navrow+.navrow{border-top:1px solid rgba(34,42,52,.6);}
  .navrow:active{opacity:.6;}
  .navrow .gl{flex:1;}
  .navrow .gl .n{font-family:'Rajdhani'; font-weight:700; font-size:16px;}
  .navrow .gl .s{font-size:11px; color:var(--txt2); margin-top:1px;}
  .navrow .ch{color:var(--txt2); font-size:22px; font-weight:300;}
  /* sub-page */
  .page{position:fixed; inset:0; background:var(--bg); z-index:25; overflow-y:auto; padding:14px 14px 30px; animation:slidein .26s cubic-bezier(.22,.9,.27,1); will-change:transform,opacity;}
  @keyframes slidein{from{transform:translateX(34px); opacity:0;}to{transform:translateX(0); opacity:1;}}
  .page.closing{animation:slideout .2s cubic-bezier(.4,0,.7,.3) forwards; pointer-events:none;}
  @keyframes slideout{from{transform:translateX(0); opacity:1;}to{transform:translateX(34px); opacity:0;}}
  .pgh{display:flex; align-items:center; gap:12px; margin-bottom:14px; padding-top:2px;}
  .pgback{width:40px;height:40px;border-radius:11px;background:var(--surf);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;}
  .pgback svg{width:20px;height:20px;color:var(--txt);}
  .pgback:active{transform:scale(.92);}
  .pgh h2{font-family:'Chakra Petch'; font-weight:700; font-size:18px;}

  .badge{display:flex; align-items:center; gap:5px; background:rgba(232,180,74,.12); padding:6px 10px; border-radius:9px; border:1px solid rgba(232,180,74,.2);}
  .badge b{font-family:'Rajdhani'; font-weight:700; font-size:12px; color:var(--gold);}

  /* modal */
  .ov{position:fixed; inset:0; background:rgba(0,0,0,.74); display:flex; align-items:center; justify-content:center; padding:24px; z-index:30; animation:fade .2s ease;}
  @keyframes fade{from{opacity:0;}to{opacity:1;}}
  .modal{width:100%; max-width:340px; background:linear-gradient(160deg,var(--surf2),var(--bg)); border:1px solid rgba(95,200,255,.32); border-radius:20px; padding:20px; animation:pop .3s cubic-bezier(.2,1.3,.4,1);}
  @keyframes pop{from{opacity:0; transform:scale(.85);}to{opacity:1; transform:scale(1);}}
  .modal h3{font-family:'Chakra Petch'; font-weight:700; font-size:17px; margin-bottom:3px;}
  .modal p{font-size:12px; color:var(--txt2); margin-bottom:6px; line-height:1.45;}
  .modal label{font-size:10px; letter-spacing:2px; color:var(--txt2); font-weight:600; display:block; margin:12px 2px 5px;}
  .modal input,.modal textarea{width:100%; background:#0d1117; border:1px solid var(--line); border-radius:10px; padding:11px 12px; color:var(--txt); font-size:14px; font-family:'Inter'; resize:none;}
  .modal input:focus,.modal textarea:focus{outline:none; border-color:var(--cyan);}
  .mrow{display:flex; gap:10px; margin-top:18px;}
  .mrow .btn{flex:1; text-align:center; padding:12px; font-size:13px; font-family:'Rajdhani'; font-weight:700; border-radius:11px; border:none; cursor:pointer; letter-spacing:.5px;}
  .btn.ghost{background:var(--surf2); color:var(--txt2);}
  .btn.go{background:linear-gradient(180deg,var(--blue-hi),var(--blue-deep)); color:#04121f;}
  .btn.go:disabled{opacity:.45;}
  .err{color:var(--danger); font-size:12px; margin-top:10px; min-height:14px;}

  /* custom toast */
  #toasts{position:fixed; left:0; right:0; bottom:26px; display:flex; flex-direction:column; align-items:center; gap:8px; z-index:50; pointer-events:none;}
  .ctoast{display:flex; align-items:center; gap:9px; background:#12161c; border:1px solid var(--line); color:var(--txt);
    font-family:'Rajdhani'; font-weight:600; font-size:14px; padding:11px 16px; border-radius:13px; box-shadow:0 10px 30px rgba(0,0,0,.5); animation:tin .3s cubic-bezier(.2,1.3,.4,1);}
  .ctoast.good{border-color:rgba(45,212,167,.5);} .ctoast.bad{border-color:rgba(255,94,108,.5);}
  .ctoast .ic{width:20px;height:20px;display:flex;align-items:center;justify-content:center;border-radius:50%;flex:0 0 auto;font-size:12px;font-weight:800;}
  .ctoast.good .ic{background:rgba(45,212,167,.2); color:var(--emerald);} .ctoast.bad .ic{background:rgba(255,94,108,.2); color:var(--danger);}
  @keyframes tin{from{opacity:0; transform:translateY(16px);}to{opacity:1; transform:translateY(0);}}
  .ctoast.out{animation:tout .3s ease forwards;}
  @keyframes tout{to{opacity:0; transform:translateY(16px);}}

  /* reward reveal (treasure chest pop) */
  .rewardpop{position:fixed; inset:0; z-index:45; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none; background:radial-gradient(closest-side, rgba(0,0,0,.5), transparent 70%); animation:rpfade 1.6s ease forwards;}
  @keyframes rpfade{0%{opacity:0;}12%{opacity:1;}80%{opacity:1;}100%{opacity:0;}}
  .rpchest{width:172px;height:172px;filter:drop-shadow(0 0 36px rgba(255,210,120,.6));animation:rpchest 1s cubic-bezier(.2,1.4,.4,1) both;}
  @keyframes rpchest{0%{opacity:0;transform:scale(.4) translateY(24px) rotate(-6deg);}45%{opacity:1;transform:scale(1.08) rotate(2deg);}100%{opacity:1;transform:scale(1) rotate(0);}}
  .rpamt{font-family:'Teko';font-weight:700;font-size:50px;line-height:1;color:#FFE08A;text-shadow:0 0 20px rgba(232,180,74,.8);margin-top:2px;display:flex;align-items:center;gap:9px;animation:rpamt 1.6s ease both;}
  .rpamt .dia{width:30px;height:30px;}
  @keyframes rpamt{0%{opacity:0;transform:translateY(14px);}30%{opacity:1;transform:translateY(0);}82%{opacity:1;}100%{opacity:0;transform:translateY(-26px);}}

  @keyframes rise{from{opacity:0;}to{opacity:1;}}
  #app>*{animation:rise .42s ease both;}
  #app>*:nth-child(3){animation-delay:.04s;} #app>*:nth-child(5){animation-delay:.08s;} #app>*:nth-child(7){animation-delay:.12s;} #app>*:nth-child(9){animation-delay:.16s;}
  @media (prefers-reduced-motion:reduce){*{animation:none !important;}}
  /* ── TOURNAMENT ── */
  .tbanner{position:relative; overflow:hidden; border-radius:18px; padding:16px 16px 18px; cursor:pointer;
    background:radial-gradient(90% 130% at 92% 6%, rgba(255,45,85,.34), transparent 60%), linear-gradient(125deg,#2a0f1f,#0b0712 62%);
    border:1px solid rgba(255,45,85,.45); box-shadow:0 12px 32px -14px rgba(255,45,85,.5);}
  .tbanner:active{transform:scale(.99);}
  .tbanner .lbl{font-family:'Chakra Petch'; font-weight:700; font-size:10px; letter-spacing:3px; color:#FF7591; display:flex; align-items:center; gap:7px;}
  .tbanner .live{width:7px;height:7px;border-radius:50%;background:#FF2D55;box-shadow:0 0 9px #FF2D55;animation:blink 1.4s infinite;}
  @keyframes blink{50%{opacity:.25;}}
  .tbanner h3{font-family:'Chakra Petch'; font-weight:700; font-size:18px; margin:9px 0 8px;}
  .tbanner .ppl{font-size:10px;letter-spacing:2px;color:var(--txt2);font-weight:600;margin-bottom:3px;}
  .tbanner .pp{font-family:'Teko'; font-weight:700; font-size:42px; line-height:.85; color:#FFE08A; text-shadow:0 0 18px rgba(232,180,74,.5);}
  .tbanner .go{position:absolute;right:16px;bottom:16px;display:inline-flex;align-items:center;gap:6px;font-family:'Rajdhani';font-weight:700;font-size:13px;letter-spacing:1px;color:#25F4EE;}
  .tphero{border-radius:18px;padding:18px;margin-bottom:6px;overflow:hidden;background:linear-gradient(125deg, rgba(8,5,12,.9) 16%, rgba(8,5,12,.5) 60%, rgba(8,5,12,.28) 100%), url('hero-tourn.jpg') center/cover #0a0810;border:1px solid rgba(255,45,85,.4);}
  .tphero h3{font-family:'Chakra Petch';font-weight:700;font-size:20px;}
  .tphero .desc{font-size:12px;color:var(--txt2);margin-top:4px;line-height:1.45;}
  .tphero .pp{font-family:'Teko';font-weight:700;font-size:54px;line-height:.85;color:#FFE08A;text-shadow:0 0 22px rgba(232,180,74,.5);margin-top:10px;}
  .tphero .ppl{font-size:10px;letter-spacing:2px;color:#FF7591;font-weight:700;}
  .tphero .cd{margin-top:8px;font-family:'Rajdhani';font-weight:700;color:#25F4EE;font-size:14px;}
  .lbrow{display:flex;align-items:center;gap:11px;padding:10px 4px;border-bottom:1px solid rgba(34,42,52,.55);}

function toast(msg,kind){

}
function gainFx(amount,kind){

let STATE=null;
const $=h=>{const d=document.createElement('div'); d.innerHTML=h.trim(); return d.firstChild;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// Compact: 999 -> "999", 1000 -> "1k", 1234 -> "1.2k", 12345 -> "12k", 1.2M -> "1.2M"
const kFmt=n=>{n=+n||0; if(n>=1e6)return (n/1e6).toFixed(n>=1e7?0:1).replace(/\.0$/,'')+'M'; if(n>=1000)return (n/1000).toFixed(n>=1e4?0:1).replace(/\.0$/,'')+'k'; return ''+n;};
const ago=ts=>{const d=Math.floor((Date.now()-ts)/1000); if(d<60)return'just now'; if(d<3600)return Math.floor(d/60)+'m ago'; if(d<86400)return Math.floor(d/3600)+'h ago'; return Math.floor(d/86400)+'d ago';};
const dateStr=ts=>new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric'});
function activeTiers(s){ return s.tiers.filter(t=>!(t.firstOnly&&s.account.firstWithdrawUsed)).slice().sort((a,b)=>a.cost-b.cost); }
function goalTier(s){ const at=activeTiers(s),b=s.account.balance; return at.find(t=>t.firstOnly)||at.find(t=>b<t.cost)||at[at.length-1]; }
// Ang GOAL ay yung tier na PINILI ng user (WSEL) — kaya pwede nilang palitan ang withdrawal
// goal anytime para makita ang progress. Default = susunod na tier na ipinapaipon (goalTier).
function ensureSel(s){ const at=activeTiers(s); if(!at.length) return null; if(WSEL==null||!at.find(t=>t.cost===WSEL)) WSEL=goalTier(s).cost; return at.find(t=>t.cost===WSEL)||at[0]; }
function taskIcon(t){

  if(t.logo) return `<img src="${esc(t.logo)}" alt="">`;

  if(/video|watch/i.test(t.title)) return IC.play;
  return II('ic-daily');
}

function withdrawPanel(s){
  const a=s.account;
  const avail=activeTiers(s);
  if(!avail.length) return $(`<div class="empty">No withdrawal tiers available right now.</div>`);
  const sel=ensureSel(s);  // kaparehong WSEL ng hero goal — naka-sync ang progress sa taas
  const can=a.balance>=sel.cost && !a.earnBanned;
  const wrap=$(`<div class="wd"></div>`);
  const grid=$(`<div class="tiers wsel"></div>`);
  avail.forEach(t=>{
    const ok=a.balance>=t.cost;
    const el=$(`<div class="tier sgrid ${t.cost===WSEL?'sel':''} ${ok?'':'poor'}">
      ${t.cost===WSEL?'<div class="selck">✓</div>':''}

      <div class="c"><span class="dia gold" style="width:14px;height:14px"></span>${t.cost.toLocaleString()}</div></div>`);
    el.onclick=()=>{ WSEL=t.cost; render(); };
    grid.appendChild(el);
  });
  wrap.appendChild(grid);
  const btn=$(`<button class="wdbtn ${can?'go':'off'}">${a.earnBanned?'EARNING DISABLED':can?('WITHDRAW '+sel.mlbb+' MLBB DIAMONDS'):('COLLECT '+(sel.cost-a.balance).toLocaleString()+' MORE POINTS')}</button>`);

// ── Page stack + smooth back ─────────────────────────────────────────────────
// Bawat .page = isang history entry (pushState). Kaya pareho — ang back ARROW at ang
// HARDWARE/gesture back ng phone — dumadaan sa popstate at SMOOTH na nagsa-slide out.
// (Native side: BackHandler → webView.goBack() kapag may bukas na page.)
let PSTACK=[];
function animClose(el, after){ if(!el||el._closing) return; el._closing=true; el.classList.add('closing'); setTimeout(()=>{ el.remove(); if(after) after(); },200); }
function registerPage(el, after){ PSTACK.push({el, after}); try{ history.pushState({ep:PSTACK.length},''); }catch(e){} }
window.addEventListener('popstate', ()=>{ const p=PSTACK.pop(); if(p) animClose(p.el, p.after); });
// Back arrow → dumaan sa history para naka-sync sa hardware back (parehong smooth na daanan).
function closePage(el){ const top=PSTACK[PSTACK.length-1]; if(top && top.el===el){ history.back(); } else animClose(el); }
function openPage(title, build){
  const pg=$(`<div class="page"><div class="pgh"><div class="pgback">${IC.back}</div><h2>${esc(title)}</h2></div></div>`);
  pg.querySelector('.pgback').onclick=()=>closePage(pg);
  const body=document.createElement('div'); build(body); pg.appendChild(body);
  document.body.appendChild(pg); registerPage(pg);
}

      <span class="stat ${x.status}">${(({pending:'Pending',fulfilled:'Successful',rejected:'Rejected'})[x.status]||x.status).toUpperCase()}</span></div>`)));
    b.appendChild(c);
  });
}
